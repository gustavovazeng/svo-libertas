    </div>
        <p class="foot">Base Meta (Stract) + Base Vendas (Eduzz) · Google Sheets API v4</p>`;

  requestAnimationFrame(()=>{
    const sW=document.getElementById(`tc-${CHART_CONFIGS[0].key}`)?.parentElement?.offsetWidth||500;
    CHART_CONFIGS.forEach(c=>{
      const ov=S.overlays[c.key];
      drawChartWithOverlay(`tc-${c.key}`,daily,c.key,c.fmt,c.meta,c.metaLbl,ov.inv,ov.cpv,sW,170);
      const tipLines=[{key:c.key,color:CHART_COLOR,name:c.lbl,fmt:c.fmt}];
      if(ov.inv) tipLines.push({key:"spend",color:CHART_INV,name:"Investimento",fmt:fBRL});
      if(ov.cpv) tipLines.push({key:"cpv",  color:CHART_CPV,name:"CPV",         fmt:fBRL});
      setupTip(`tc-${c.key}`,`tt-${c.key}`,daily,tipLines,52,ov.inv||ov.cpv?52:12);
    });
  });
}

// ── Render Campanhas + Anúncios (aba unificada) ───────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const _focusedId=document.activeElement?.id; // preserva foco dos inputs de busca
  const dd=D();
  const start=S.startDate, end=S.endDate;

  // ── 0. Mapas compartilhados: identidade, compradores por adId, gasto total por evento ─
  const _identMap=new Map();
  function _getIdKeys(r){
    const ks=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em) ks.push("e:"+em);
    if(cpf) ks.push("c:"+cpf);
    if(tel) ks.push("t:"+tel);
    return ks;
  }
  for(const r of dd.funilRows){
    const ks=_getIdKeys(r);if(!ks.length)continue;
    let canonical=null;
    for(const k of ks){if(_identMap.has(k)){canonical=_identMap.get(k);break;}}
    if(!canonical) canonical=ks[0];
    for(const k of ks) _identMap.set(k,canonical);
  }
  function _getCanonical(r){
    const ks=_getIdKeys(r);
    for(const k of ks){if(_identMap.has(k)) return _identMap.get(k);}
    return ks[0]||null;
  }
  // adBuyersMap: adId → Set<buyerKey> (compradores do Reto atribuídos a cada adId)
  const adBuyersMap=new Map();
  for(const r of dd.funilRows){
    const dt=toISO(r["Data da compra"]||"")||"";
    if(dt<start||dt>end) continue;
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    if(classifyProduct(r["Nome do produto"]||"")!=="reto") continue;
    const adId=extractAdId(r["Ad Id"]||"");if(!adId)continue;
    const key=_getCanonical(r);if(!key)continue;
    if(!adBuyersMap.has(adId)) adBuyersMap.set(adId,new Set());
    adBuyersMap.get(adId).add(key);
  }
  // buyerTotalSpent: buyerKey → receita total do comprador
  // Sem filtro de data para capturar upsells que ocorrem fora do período
  const buyerTotalSpent=new Map();
  for(const r of dd.funilRows){
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    const key=_getCanonical(r);if(!key)continue;
    buyerTotalSpent.set(key,(buyerTotalSpent.get(key)||0)+(parseFloat(r["Valor do produto"])||0));
  }

  // ── 1a. País selecionado → countryAllowedIds (deve ser calculado antes de campRows)
  const hasCountryFilter=S.selectedCountry!=="todos";
  let countryAllowedIds=null;
  if(hasCountryFilter){
    const cEntry=dd.metaByCountry[S.selectedCountry];
    countryAllowedIds=cEntry?new Set([...cEntry.adIds]):new Set();
  }

  // ── 1b. Métricas por país (período filtrado) para a tabela de países ────
  const countryStats={};
  const countryBuyerSets={};
  for(const [adId,adData] of Object.entries(dd.metaByAdId)){
    const country=adData.country;
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
    for(const [d,vals] of Object.entries(adData.byDate)){
      if(d>=start&&d<=end){
        countryStats[country].spend+=vals.spend;
        countryStats[country].clicks+=vals.clicks;
        countryStats[country].impressions+=vals.impressions;
        countryStats[country].ic+=vals.ic||0;
      }
    }
    const vByD=dd.vendasByAdDate[adId]||{};
    for(const [vd,vv] of Object.entries(vByD)){
      if(vd>=start&&vd<=end) countryStats[country].qtd+=vv.qtd;
    }
    if(!countryBuyerSets[country]) countryBuyerSets[country]=new Set();
    for(const ek of (adBuyersMap.get(adId)||new Set())) countryBuyerSets[country].add(ek);
  }
  for(const [country,keys] of Object.entries(countryBuyerSets)){
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0};
    for(const ek of keys) countryStats[country].funilRev+=(buyerTotalSpent.get(ek)||0);
  }

  // ── 1c. Constrói linhas de campanha (filtradas por país quando necessário)
  const campRows=[];
  for(const [campName,meta] of Object.entries(dd.metaByCamp)){
    const byDate=dd.metaByCampByDate[campName]||{};
    // Coleta adIds do período
    const adIdsPeriod=new Set();
    for(const [d,vals] of Object.entries(byDate)){
      if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsPeriod.add(id));
    }
    // Filtra por país se necessário
    const adIdsC=countryAllowedIds
      ? new Set([...adIdsPeriod].filter(id=>countryAllowedIds.has(id)))
      : adIdsPeriod;
    if(adIdsC.size===0) continue;
    // Spend/clicks/impressions — recalcula por adId quando país filtrado
    let cSpend=0,cClicks=0,cImpr=0,cIc=0;
    if(countryAllowedIds){
      for(const adId of adIdsC){
        const adData=dd.metaByAdId[adId];if(!adData)continue;
        for(const [d,vals] of Object.entries(adData.byDate)){
          if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;}
        }
      }
    } else {
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;}
      }
    }
    if(cSpend===0) continue;
    let cQtd=0;
    for(const adId of adIdsC){
      const byD=dd.vendasByAdDate[adId]||{};
      for(const [vd,vv] of Object.entries(byD)){
        if(vd>=start&&vd<=end) cQtd+=vv.qtd;
      }
    }
    const campEvKeys=new Set();
    for(const adId of adIdsC){
      for(const ek of (adBuyersMap.get(adId)||new Set())) campEvKeys.add(ek);
    }
    let campFunilRev=0;
    for(const ek of campEvKeys) campFunilRev+=(buyerTotalSpent.get(ek)||0);
    campRows.push({campName,spend:cSpend,clicks:cClicks,impressions:cImpr,
      qtd:cQtd,valor:campFunilRev,
      cpc:cClicks>0?cSpend/cClicks:0,
      ctr:cImpr>0?(cClicks/cImpr)*100:0,
      cpm:cImpr>0?(cSpend/cImpr)*1000:0,
      cpv:cQtd>0?cSpend/cQtd:0,
      roas:cSpend>0?campFunilRev/cSpend:0,
      ticket:cQtd>0?campFunilRev/cQtd:0,
      ic:cIc, cpic:cIc>0?cSpend/cIc:0,
      campStatus:dd.metaByCamp[campName]?.campStatus||'',
      adIds:adIdsC});
  }
  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string") return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });
  const filteredCamps=S.campSearch.trim()
    ? sortedCamps.filter(c=>c.campName.toLowerCase().includes(S.campSearch.trim().toLowerCase()))
    : sortedCamps;
  S._campOrder=filteredCamps.map(r=>r.campName);

  // ── 2. allowedAdIds: campRows já está filtrado por país, então a interseção é automática
  const hasFilter=S.selectedCamps.size>0;
  let allowedAdIds=null;
  if(hasFilter){
    allowedAdIds=new Set();
    for(const c of campRows){
      if(S.selectedCamps.has(c.campName)) c.adIds.forEach(id=>allowedAdIds.add(id));
    }
    // campRows.adIds já foram intersectados com countryAllowedIds, não precisa reintersectar
  } else if(countryAllowedIds){
    allowedAdIds=countryAllowedIds;
  }

  // ── 3. Constrói linhas de anúncios ──────────────────────────────────────
  function buildAdRows(start,end,allowedAdIds){
    const rows=[];
    for(const [advCode,meta] of Object.entries(dd.metaByAd)){
      const byDate=dd.metaByAdByDate[advCode]||{};

      // Coleta todos os adIds deste advCode dentro do período
      const adIdsInPeriod=new Set();
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsInPeriod.add(id));
      }
      const allIds=adIdsInPeriod.size>0?adIdsInPeriod:meta.adIds;

      // Quando há filtro de campanha, restringe aos adIds permitidos
      const useIds=allowedAdIds
        ? new Set([...allIds].filter(id=>allowedAdIds.has(id)))
        : allIds;
      if(useIds.size===0) continue;

      // Spend / clicks / impressions — calculado a partir dos adIds filtrados
      let spend=0,clicks=0,impressions=0,landingViews=0,ic=0,video3s=0,video15s=0,igUrl="";
      if(allowedAdIds){
        // Usa metaByAdId para precisão por campanha
        for(const adId of useIds){
          const adData=dd.metaByAdId[adId];if(!adData)continue;
          for(const [d,vals] of Object.entries(adData.byDate)){
            if(d>=start&&d<=end){
              spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
              landingViews+=vals.landingViews||0;
              ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
              if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
            }
          }
        }
      } else {
        // Sem filtro: usa o agregado por advCode (mais eficiente)
        for(const [d,vals] of Object.entries(byDate)){
          if(d>=start&&d<=end){
            spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
            landingViews+=vals.landingViews||0;
            ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
            if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
          }
        }
      }
      if(spend===0) continue;

      // Vendas (já são por adId — basta filtrar pelos adIds certos)
      let qtd=0,valor=0,taxa=0;
      for(const adId of useIds){
        const byD=dd.vendasByAdDate[adId]||{};
        for(const [vd,vvals] of Object.entries(byD)){
          if(vd>=start&&vd<=end){qtd+=vvals.qtd;valor+=vvals.valor;taxa+=vvals.taxa;}
        }
      }
      if(!igUrl) igUrl=meta.igUrl;

      // Status: ativo se qualquer adId tiver ad+adset+camp todos ACTIVE
      let isActive=false, hasStatusData=false;
      for(const adId of useIds){
        const adData=dd.metaByAdId[adId];
        if(!adData) continue;
        if(adData.adStatus) hasStatusData=true;
        if(adData.adStatus==="ACTIVE"&&adData.adsetStatus==="ACTIVE"&&adData.campStatus==="ACTIVE"){
          isActive=true; break;
        }
      }

      // Receita total do comprador (para ROAS; sem filtro de data)
      let totalAscensoes=0;
      for(const adId of useIds){
        for(const eventKey of (adBuyersMap.get(adId)||new Set())){
          totalAscensoes+=(buyerTotalSpent.get(eventKey)||0);
        }
      }
      rows.push({advCode,adName:dd.metaByAd[advCode]?.adName||advCode,spend,clicks,impressions,qtd,valor,igUrl,
        cpc:clicks>0?spend/clicks:0,
        ctr:impressions>0?(clicks/impressions)*100:0,
        cpm:impressions>0?(spend/impressions)*1000:0,
        cpv:qtd>0?spend/qtd:0,
        ticket:qtd>0?valor/qtd:0,
        roas:spend>0&&totalAscensoes>0?totalAscensoes/spend:0,
        ic, cpic:ic>0?spend/ic:0,
        hookRate:impressions>0?(video3s/impressions)*100:0,
        holdRate:video3s>0?(video15s/video3s)*100:0,
        txPagChk:landingViews>0?(ic/landingViews)*100:0,
        txChkVnd:ic>0?(qtd/ic)*100:0,
        isActive, hasStatusData});
    }
    return rows.filter(r=>r.spend>0);
  }

  const adRows=buildAdRows(start,end,allowedAdIds);

  // ── 4. Totais KPI (do período filtrado) ─────────────────────────────────
  // Se há filtro de campanhas, agrega só das campanhas selecionadas; caso contrário usa dados diários
  let tot;
  if(hasFilter){
    tot=campRows.filter(c=>S.selectedCamps.has(c.campName))
      .reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,
        impressions:a.impressions+c.impressions,qtd:a.qtd+c.qtd,valor:a.valor+c.valor}),
        {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  } else {
    const _da=D();
    const dailyA=[];
    for(const d of Array.from(new Set([...Object.keys(_da.meta),...Object.keys(_da.vendas)])).sort()){
      if(d<start||d>end) continue;
      const m=_da.meta[d]||{spend:0,clicks:0,impressions:0};
      const v=_da.vendas[d]||{qtd:0,valor:0};
      dailyA.push({spend:m.spend,clicks:m.clicks,impressions:m.impressions,qtd:v.qtd,valor:v.valor});
    }
    tot=dailyA.reduce((a,d)=>({spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
      impressions:a.impressions+d.impressions,qtd:a.qtd+d.qtd,valor:a.valor+d.valor}),
      {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  }
  const totCpc=tot.clicks>0?tot.spend/tot.clicks:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const totCpm=tot.impressions>0?(tot.spend/tot.impressions)*1000:0;
  const totCpv=tot.qtd>0?tot.spend/tot.qtd:0;
  const totTicket=tot.qtd>0?tot.valor/tot.qtd:0;

  // ── 5. Ordenação anúncios ────────────────────────────────────────────────
  const {col,dir}=S.aSort;
  const sorted=[...adRows].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string") return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  const filteredAds=S.adSearch.trim()
    ? sorted.filter(r=>r.advCode.toLowerCase().includes(S.adSearch.trim().toLowerCase()))
    : sorted;
  S._adOrder=filteredAds.map(r=>r.advCode);

  function sc(v,meta,hi){return statusColor(v,meta,hi);}

  function thC(col_,lbl,sortFn){
    const active=(sortFn==="camp"?cCol:col)===col_;
    const activeDir=sortFn==="camp"?cDir:dir;
    const arrow=active?(activeDir==="asc"?" ↑":" ↓"):" ↕";
    const fn=sortFn==="camp"?`sortCampanhas('${col_}')`:`sortAnuncios('${col_}')`;
    const isName=col_==="campName"||col_==="advCode";
    const align=isName?"left":"right";
    return `<th onclick="${fn}" style="padding:10px 14px;text-align:${align};font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${active?"var(--text)":"var(--hint)"};cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  }

  // ── 6. Render ────────────────────────────────────────────────────────────
  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas / Anúncios</div>
        <div class="hdr-sub">atualizado em: ${dd.updated||"—"} · ${filteredCamps.length}/${sortedCamps.length} campanhas · ${filteredAds.length}/${sorted.length} anúncios${hasFilter?" · filtrando "+S.selectedCamps.size+" campanha"+(S.selectedCamps.size>1?"s":""):""}</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div class="section-lbl">Resumo do período${hasFilter?" · campanhas selecionadas":""}</div>
    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:13px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val" style="font-size:18px">${fBRL(tot.spend)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas</div><div class="kc-val" style="font-size:18px">${tot.qtd}</div></div>
      <div class="kc" style="border-color:${statusBorder(totCpv,META_CPV,false)}"><div class="kc-lbl">Custo por Venda</div><div class="kc-val" style="color:${sc(totCpv,META_CPV,false)};font-size:18px">${fBRL(totCpv)}</div><div class="kc-sub">meta ${fBRL(META_CPV)}</div></div>
      <div class="kc" style="border-color:${statusBorder(totTicket,META_TICKET,true)}"><div class="kc-lbl">Ticket Médio</div><div class="kc-val" style="color:${sc(totTicket,META_TICKET,true)};font-size:18px">${fBRL(totTicket)}</div><div class="kc-sub">meta ${fBRL(META_TICKET)}</div></div>
      <div class="kc" style="border-color:${statusBorder(totCtr,METAS_T.ctr.val,true)}"><div class="kc-lbl">CTR</div><div class="kc-val" style="color:${sc(totCtr,METAS_T.ctr.val,true)};font-size:18px">${fPct(totCtr)}</div><div class="kc-sub">meta ${fPct(METAS_T.ctr.val)}</div></div>
      <div class="kc" style="border-color:${statusBorder(totCpm,METAS_T.cpm.val,false)}"><div class="kc-lbl">CPM</div><div class="kc-val" style="color:${sc(totCpm,METAS_T.cpm.val,false)};font-size:18px">${fBRL(totCpm)}</div><div class="kc-sub">meta ${fBRL(METAS_T.cpm.val)}</div></div>
    </div>

    ${(()=>{
      // Tabela de países — dinâmica, derivada dos adsets do Meta CSV
      const countries=Object.keys(countryStats).sort((a,b)=>{
        if(a==="Brasil") return -1; if(b==="Brasil") return 1;
        return a.localeCompare(b);
      });
      if(countries.length<=1) return "";
      const flagMap={
        "México":"🇲🇽","Argentina":"🇦🇷","Chile":"🇨🇱","Colombia":"🇨🇴",
        "Costa Rica":"🇨🇷","El Salvador":"🇸🇻","Equador":"🇪🇨","EUA":"🇺🇸",
        "Guatemala":"🇬🇹","Peru":"🇵🇪","Brasil":"🇧🇷","Portugal":"🇵🇹",
        "China":"🇨🇳","Espanha":"🇪🇸","Bolívia":"🇧🇴","Paraguai":"🇵🇾",
        "Uruguai":"🇺🇾","Venezuela":"🇻🇪","Panamá":"🇵🇦","Honduras":"🇭🇳",
        "Nicarágua":"🇳🇮","Cuba":"🇨🇺","República Dominicana":"🇩🇴",
      };
      // Linha "Todos" agrega todos os países
      const totRow={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
      for(const s of Object.values(countryStats)){
        totRow.spend+=s.spend;totRow.clicks+=s.clicks;
        totRow.impressions+=s.impressions;totRow.qtd+=s.qtd;totRow.funilRev+=s.funilRev;totRow.ic+=(s.ic||0);
      }
      function cpRow(c,s,isTodos){
        const sel=!isTodos&&S.selectedCountry===c;
        const bg=sel?"rgba(251,191,36,.12)":"transparent";

        const label=isTodos?"🌎 Todos":(flagMap[c]||"🌐")+" "+c;
        const cpc=s.clicks>0?s.spend/s.clicks:0;
        const ctr=s.impressions>0?(s.clicks/s.impressions)*100:0;
        const cpm=s.impressions>0?(s.spend/s.impressions)*1000:0;
        const cpv=s.qtd>0?s.spend/s.qtd:0;
        const roas=s.spend>0?s.funilRev/s.spend:0;
        const ticket=s.qtd>0?s.funilRev/s.qtd:0;

          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${s.qtd>0?sc(cpv,META_CPV,false):"var(--hint)"}">${s.qtd>0?fBRL(cpv):"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${s.qtd>0?sc(roas,META_ROAS,true):"var(--hint)"}">${s.qtd>0?roas.toFixed(2)+"x":"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${s.qtd>0?fBRL(ticket):"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${(s.ic||0)>0?fBRL(s.spend/(s.ic||1)):"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${sc(ctr,METAS_T.ctr.val,true)}">${fPct(ctr)}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${sc(cpm,METAS_T.cpm.val,false)}">${fBRL(cpm)}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${sc(cpc,METAS_T.cpc.val,false)}">${fBRL(cpc)}</td>
        </tr>`;
      }
      const thStyle="padding:9px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border);white-space:nowrap";
      return `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span class="section-lbl" style="margin:0">País</span>
        ${hasCountryFilter?`<span style="font-size:10px;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:2px 8px;border-radius:5px">${S.selectedCountry}</span>`:""}
        <span style="font-size:10px;color:var(--hint)">Clique para filtrar campanhas e anúncios por país</span>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px">
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr>
            <th style="${thStyle};text-align:left">País</th>
            <th style="${thStyle};text-align:right">Investimento</th>
            <th style="${thStyle};text-align:right">Vendas</th>
            <th style="${thStyle};text-align:right">Custo/Venda</th>
            <th style="${thStyle};text-align:right">ROAS</th>
            <th style="${thStyle};text-align:right">Ticket Médio</th>
            <th style="${thStyle};text-align:right">Custo/IC</th>
            <th style="${thStyle};text-align:right">CTR</th>
            <th style="${thStyle};text-align:right">CPM</th>
            <th style="${thStyle};text-align:right">CPC</th>
          </tr></thead>
          <tbody>
            ${cpRow("todos",totRow,true)}
            ${countries.map(c=>cpRow(c,countryStats[c]||{spend:0,clicks:0,impressions:0,qtd:0,funilRev:0},false)).join("")}
          </tbody>
        </table>
      </div>`;
    })()}

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span class="section-lbl" style="margin:0">Campanhas</span>
      ${hasFilter?`<button onclick="clearCamps()" style="font-size:10px;padding:3px 10px;border-radius:6px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar seleção (${S.selectedCamps.size})</button>`:""}
      <input id="camp-search-input" oninput="setCampSearch(this.value)" value="${S.campSearch.replace(/"/g,'&quot;')}"
        placeholder="Buscar campanha\u2026"
        style="background:var(--surf);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px;font-family:'DM Sans',sans-serif;padding:4px 10px;outline:none;width:200px;transition:border-color .15s"
        onfocus="this.style.borderColor='rgba(96,165,250,.5)'" onblur="this.style.borderColor='var(--border)'">
      ${S.campSearch?`<button onclick="setCampSearch('')" style="font-size:10px;padding:3px 8px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--hint);cursor:pointer;font-family:'DM Sans',sans-serif">✕</button>`:""}
      <span style="font-size:10px;color:var(--hint)">Clique para filtrar anúncios por campanha</span>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr>
          ${thC("campName","Campanha","camp")}
          ${thC("spend","Investimento","camp")}
          ${thC("qtd","Vendas","camp")}
          ${thC("cpv","Custo/Venda","camp")}
          ${thC("roas","ROAS","camp")}
          ${thC("cpic","Custo/IC","camp")}
          ${thC("ctr","CTR","camp")}
          ${thC("cpm","CPM","camp")}
          ${thC("cpc","CPC","camp")}
        </tr></thead>
        <tbody>
          ${filteredCamps.map(r=>{
            const sel=S.selectedCamps.has(r.campName);
            const bg=sel?"rgba(59,130,246,.12)":"transparent";
            const bord=sel?"border-left:3px solid #3b82f6":"border-left:3px solid transparent";
            const safeN=r.campName.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
            return `<tr data-camp="${safeN}" style="border-bottom:1px solid var(--border);background:${bg};${bord};cursor:pointer;transition:background .1s"
              onclick="toggleCamp(this.dataset.camp,event.shiftKey)"
              onmouseover="this.style.background='${sel?"rgba(59,130,246,.18)":"rgba(255,255,255,.025)"}'"
              onmouseout="this.style.background='${bg}'">
              <td style="padding:10px 14px;text-align:left;max-width:300px">
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:14px;height:14px;border-radius:3px;border:1.5px solid ${sel?"#3b82f6":"var(--border-h)"};background:${sel?"#3b82f6":"transparent"};display:flex;align-items:center;justify-content:center;flex-shrink:0">
                    ${sel?`<svg width="9" height="7" viewBox="0 0 9 7" fill="none"><path d="M1 3.5L3.5 6L8 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}
                  </div>
                  <span style="font-size:11px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.campName}">${r.campName}</span>
                </div>
              </td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(r.spend)}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${r.qtd}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.cpv,META_CPV,false)}">${r.qtd>0?fBRL(r.cpv):"—"}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${r.qtd>0?sc(r.roas,META_ROAS,true):"var(--hint)"}">${r.qtd>0?r.roas.toFixed(2)+"x":"—"}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${r.ic>0?fBRL(r.cpic):"—"}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.ctr,METAS_T.ctr.val,true)}">${fPct(r.ctr)}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.cpm,METAS_T.cpm.val,false)}">${fBRL(r.cpm)}</td>
              <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${sc(r.cpc,METAS_T.cpc.val,false)}">${fBRL(r.cpc)}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>

    ${(()=>{
      // Painel de resumo para seleção múltipla (Item 2)
      const selCampNames=[...S.selectedCamps];
      const selAdCodes=[...S.selectedAds];
      if(selCampNames.length<1&&selAdCodes.length<1) return "";
      // Aggregate selected camps
      let pSpend=0,pQtd=0,pIc=0,pClicks=0,pImpr=0,pValor=0;
      if(selCampNames.length>0){
        for(const c of campRows){
          if(!S.selectedCamps.has(c.campName)) continue;
          pSpend+=c.spend; pQtd+=c.qtd; pIc+=c.ic||0;
          pClicks+=c.clicks; pImpr+=c.impressions; pValor+=c.valor||0;
        }
      } else if(selAdCodes.length>0){
        for(const r of adRows){
          if(!S.selectedAds.has(r.advCode)) continue;
          pSpend+=r.spend; pQtd+=r.qtd; pIc+=r.ic||0;
          pClicks+=r.clicks; pImpr+=r.impressions; pValor+=r.valor||0;
        }
      }
      const pCpv=pQtd>0?pSpend/pQtd:0;
      const pRoas=pSpend>0?pValor/pSpend:0;
      const pTicket=pQtd>0?pValor/pQtd:0;
      const pCtr=pImpr>0?(pClicks/pImpr)*100:0;
      const pCpm=pImpr>0?(pSpend/pImpr)*1000:0;
      const pCpc=pClicks>0?pSpend/pClicks:0;
      const pCpic=pIc>0?pSpend/pIc:0;
      const label=selCampNames.length>0?`${selCampNames.length} campanha${selCampNames.length>1?"s":""} selecionada${selCampNames.length>1?"s":""}`:`${selAdCodes.length} anúncio${selAdCodes.length>1?"s":""} selecionado${selAdCodes.length>1?"s":""}`;
      return `<div style="background:rgba(59,130,246,.06);border:1px solid rgba(96,165,250,.25);border-radius:12px;padding:14px 18px;margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px">📊 Resumo da seleção — ${label}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px">
          <div style="background:var(--card);border-radius:8px;padding:10px 12px"><div style="font-size:10px;color:var(--hint);margin-bottom:3px">Investimento</div><div style="font-size:13px;font-weight:700;color:var(--text-strong);font-family:'JetBrains Mono',monospace">${fBRL(pSpend)}</div></div>
          <div style="background:var(--card);border-radius:8px;padding:10px 12px"><div style="font-size:10px;color:var(--hint);margin-bottom:3px">Vendas</div><div style="font-size:13px;font-weight:700;color:var(--text-strong)">${pQtd}</div></div>
          <div style="background:var(--card);border-radius:8px;padding:10px 12px;border:1px solid ${pCpv>0?statusBorder(pCpv,META_CPV,false):"var(--border)"}"><div style="font-size:10px;color:var(--hint);margin-bottom:3px">Custo/Venda</div><div style="font-size:13px;font-weight:700;color:${pCpv>0?sc(pCpv,META_CPV,false):"var(--hint)"};font-family:'JetBrains Mono',monospace">${pQtd>0?fBRL(pCpv):"—"}</div></div>
          <div style="background:var(--card);border-radius:8px;padding:10px 12px;border:1px solid ${pRoas>0?statusBorder(pRoas,META_ROAS,true):"var(--border)"}"><div style="font-size:10px;color:var(--hint);margin-bottom:3px">ROAS</div><div style="font-size:13px;font-weight:700;color:${pRoas>0?sc(pRoas,META_ROAS,true):"var(--hint)"}">${pRoas>0?pRoas.toFixed(2)+"x":"—"}</div></div>
          <div style="background:var(--card);border-radius:8px;padding:10px 12px"><div style="font-size:10px;color:var(--hint);margin-bottom:3px">Ticket Médio</div><div style="font-size:13px;font-weight:700;color:var(--text-strong);font-family:'JetBrains Mono',monospace">${pQtd>0?fBRL(pTicket):"—"}</div></div>

  if(!name) return null;
  return "reto"; // SVO tem apenas um produto no funil
}

    {id:"reto", label:PRODUTO_SVO, step:"Produto único"},
  ];

// Vendas SVO já normalizadas — retorna direto
function expandFunilRows(rows){ return rows; }


// Deduplicação de eventos webhook:
// Mesma pessoa + mesmo produto + dentro de 7 dias → mantém o mais recente por data/hora
// Se data/hora igual → hierarquia: Reembolsado > Aguardando Reembolso > Paga > Em Recuperacao > Expirado > outros
function deduplicateFunilRows(rows){
  const STATUS_PRIORITY={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
  function sp(st){ return STATUS_PRIORITY[st]||0; }

  // Chave: email+cpf+tel+produto+janela7dias
  // Agrupa por chave e mantém o de maior prioridade/data
  const groups=new Map();
  for(const r of rows){
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    const prod=(r["Nome do produto"]||"").trim().toUpperCase();
    const dataBruta=r["Data da compra"]||"";
    const dateStr=toISO(dataBruta)||"";
    const identity=em||cpf||tel;
    if(!identity||!prod||!dateStr) { /* sem chave — adiciona direto */ groups.set(Math.random().toString(),r); continue; }

    // Encontra grupo existente com mesma identidade + produto dentro de 7 dias
    let found=null;
    for(const [k,g] of groups){
      if(!g._identity||!g._prod) continue;
      if(g._prod!==prod) continue;
      // verifica identidade
      const gEm=(g["Email"]||"").toLowerCase().trim();
      const gCpf=(g["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const gTel=(g["Telefone"]||"").replace(/[^\d]/g,"");
      const identMatch=(em&&gEm&&em===gEm)||(cpf&&gCpf&&cpf===gCpf)||(tel&&gTel&&tel===gTel);
      if(!identMatch) continue;
      // verifica janela 7 dias
      const d1=new Date((g._dateStr||"")+"T12:00:00Z");
      const d2=new Date(dateStr+"T12:00:00Z");
      const diffDays=Math.abs((d2-d1)/(86400000));
      if(diffDays<=7){ found=k; break; }
    }

    const rWithMeta={...r,_identity:identity,_prod:prod,_dateStr:dateStr};
    if(found){
      const existing=groups.get(found);
      // Mantém o mais recente; se empate, maior prioridade de status
      const existDate=existing._dateStr||"";
      const newDate=dateStr;
      const existSP=sp(existing["Status da compra"]||"");
      const newSP=sp(r["Status da compra"]||"");
      if(newDate>existDate||(newDate===existDate&&newSP>existSP)){
        groups.set(found,rWithMeta);
      }
    } else {
      groups.set(Math.random().toString(),rWithMeta);
    }
  }
  return Array.from(groups.values());
}

function buildFunilData(rows, start, end, funil){
  const f=funil||"reto";
  const primaryId="reto"; // produto de entrada do funil
  // filtered: só para análise de status/perdas — respeita período
  const filtered = rows.filter(r=>{
    if(!start && !end) return true;
    const d = toISO(r["Data da compra"]||r["Data"]);
    if(!d) return true;
    if(start && d<start) return false;
    if(end   && d>end)   return false;
    return true;
  });

  // Para buyers: usa TODAS as linhas (sem filtro de período)
  // O período só controla se a compra entra nos totais, não quem é o comprador
  const allRows = rows;

  // Agrupa por comprador (e-mail + cpf + telefone)
  // Identifica o comprador único
  function buyerKey(r){
    // Retorna chaves únicas: cada campo é prefixado para evitar colisão entre email/cpf/tel
    const keys=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em)  keys.push("e:"+em);
    if(cpf) keys.push("c:"+cpf);
    if(tel) keys.push("t:"+tel);
    return keys;
  }

  // Mapeia comprador -> conjunto de produtos comprados com data
  // Estrutura: {keys: Set, products: [{id, date, valor, status}]}
  const buyers = new Map(); // normalizedKey -> buyer obj

  function getOrCreate(r){
    const keys = buyerKey(r);
    // procura buyer existente que compartilhe pelo menos 1 chave
    for(const [k,b] of buyers){
      for(const key of keys){
        if(key && b.keys.has(key)){
          // adiciona as novas keys a esse buyer
          keys.forEach(k2=>{ if(k2) b.keys.add(k2); });
          return b;
        }
      }
    }
    // novo buyer
    const b={keys:new Set(keys.filter(Boolean)), products:[]};
    const mapKey = keys[0] || Math.random().toString();
    buyers.set(mapKey, b);
    return b;
  }

  for(const r of allRows){
    const prodId = classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const buyer = getOrCreate(r);
    const d = toISO(r["Data da compra"]||r["Data"]) || "";
    const status = normalizeStatus((r["Status da compra"]||"").trim());
    const valor  = (parseFloat(r["Valor do produto"])||0);
    const taxa   = parseBRLAbs(r["Taxa da plataforma"]);
    buyer.products.push({id:prodId, date:d, status, valor, taxa});
  }

  // Conta: só conta produtos comprados APÓS a primeira compra do manual (status Paga)
  const counts = {};
  const fat    = {};
  const taxa   = {};
  getFunilSteps(f).forEach(s=>{ counts[s.id]=0; fat[s.id]=0; taxa[s.id]=0; });

  // Status analysis
  const statusCounts = {};
  const statusVals   = {};
  const statusByProd = {};
  getFunilSteps(f).forEach(s=>{ statusByProd[s.id]={}; });

  // All rows for status analysis (sem filtro de funil)
  for(const r of filtered){
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    const val=(parseFloat(r["Valor do produto"])||0);
    statusCounts[st]=(statusCounts[st]||0)+1;
    statusVals[st]=(statusVals[st]||0)+val;
    if(!statusByProd[prodId]) statusByProd[prodId]={};
    statusByProd[prodId][st]=(statusByProd[prodId][st]||0)+1;
  }

  // Funil: só Paga, dentro do período
  // OBs de faturamento (produto principal + OBs diretos)
  const OB_FAT_IDS = new Set(["reto"]);
  // Vendas do produto principal, separadas por canal (tráfego x orgânico)
  let countTrafego=0, countOrganico=0;

  // Passo 1: agrupa por comprador+data para calcular faturamento do produto principal
  // (evita duplicatas entre webhook e histórica)
  {
    const ST_PRI={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
    const grupos=new Map();
    for(const r of filtered){
      const prodId=classifyProduct(r["Nome do produto"],f);
      if(!OB_FAT_IDS.has(prodId)) continue; // só produto principal + OBs diretos aqui
      const st=normalizeStatus((r["Status da compra"]||"").trim());
      if(!st) continue;
      const d=toISO(r["Data da compra"]||r["Data"])||"";
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const identity=em||cpf||tel; if(!identity) continue;
      const key=identity+"|"+d;
      if(!grupos.has(key)) grupos.set(key,{st,d,valor:0,taxa:0,hasPrimary:false,obCounts:{},channel:""});
      const g=grupos.get(key);
      if((ST_PRI[st]||0)>(ST_PRI[g.st]||0)) g.st=st;
      if(prodId===primaryId){ g.hasPrimary=true; g.channel=r._channel||g.channel; }
      if(st==="Paga"){
        g.valor += (parseFloat(r["Valor do produto"])||0);
        g.taxa  += parseBRLAbs(r["Taxa da plataforma"]);
        // Conta cada OB individualmente dentro do grupo
        if(prodId!==primaryId) g.obCounts[prodId]=(g.obCounts[prodId]||0)+1;
      }
    }
    for(const [,g] of grupos){
      if(!g.hasPrimary || g.st!=="Paga") continue;
      counts[primaryId]++;
      fat[primaryId] += g.valor;
      taxa[primaryId]+= g.taxa;
      if(g.channel==="trafego") countTrafego++;
      else if(g.channel==="organico") countOrganico++;
      // Contagem dos OBs desta transação
      for(const [obId, obQtd] of Object.entries(g.obCounts)){
        counts[obId]=(counts[obId]||0)+obQtd;
      }
    }
  }

  const manualCount = counts[primaryId] || 1;
  const totalFat  = Object.values(fat).reduce((a,b)=>a+b,0);
  // Taxa Eduzz: inclui Paga + Reembolsado + Aguardando Reembolso
  // (Eduzz cobra taxa mesmo em reembolsos)
  const totalTaxaPaga = Object.values(taxa).reduce((a,b)=>a+b,0);
  let totalTaxaReemb = 0;
  for(const r of filtered){
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    if(st!=="Reembolsado" && st!=="Aguardando Reembolso") continue;
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    totalTaxaReemb += parseBRLAbs(r["Taxa da plataforma"]);
  }
  const totalTaxa = totalTaxaPaga + totalTaxaReemb;

  // Spend no período (da base Meta do funil ativo)
  let totalSpend=0;
  const _metaD=S.meta;
  for(const d of Object.keys(_metaD)){
    if(start && d<start) continue;
    if(end   && d>end)   continue;
    totalSpend+=_metaD[d].spend||0;
  }

  return {
    counts, fat, manualCount, totalFat, totalSpend, buyers,
    roas: totalSpend>0 ? totalFat/totalSpend : 0,
    ltv:  totalFat/manualCount,
    lucro: totalFat - totalTaxa - (totalSpend*TAXA_IMPOSTO),
    countTrafego, countOrganico,
    cpvTrafego: countTrafego>0 ? totalSpend/countTrafego : 0,
    cpvTotal:   manualCount>0  ? totalSpend/manualCount  : 0,
    statusCounts, statusVals, statusByProd, buyers,
  };
}

// ── Render Funil ───────────────────────────────────────────────────────────
function renderFunil(){
  const el=document.getElementById("page-funil");if(!el)return;

  const _dd=D();
  // Métricas do funil usam TODAS as vendas (tráfego + orgânico) — única exceção do dashboard
  const fd=buildFunilData(_dd.funilRows,S.startDate||"",S.endDate||"");
  const {counts,totalFat,totalSpend,roas,statusCounts,statusVals,countTrafego,countOrganico,cpvTrafego,cpvTotal}=fd;

  const retoCount=counts["reto"]||0;
  const roasC=statusColor(roas,META_ROAS_FUNIL,true);
  const cpvTrafegoC=cpvTrafego>0?statusColor(cpvTrafego,META_CPV,false):"var(--text-strong)";
  const cpvTotalC=cpvTotal>0?statusColor(cpvTotal,META_CPV_TOTAL,false):"var(--text-strong)";

  const qtdReemb=(statusCounts["Reembolsado"]||0)+(statusCounts["Aguardando Reembolso"]||0);
  const valReemb=(statusVals["Reembolsado"]||0)+(statusVals["Aguardando Reembolso"]||0);
  const qtdAbrt=statusCounts["Aberta"]||0;
  const valAbrt=statusVals["Aberta"]||0;
  const pctReemb=totalFat>0?(valReemb/totalFat)*100:0;
  const pctAbrt=totalFat>0?(valAbrt/totalFat)*100:0;

  // Status / Perdas
  const stOrder=["Paga","Aberta","Em Recuperacao","Aguardando Reembolso","Reembolsado","Expirado"];
  const stC={"Paga":"var(--green)","Reembolsado":"var(--red)","Aguardando Reembolso":"var(--red)","Em Recuperacao":"var(--amber)","Aberta":"var(--amber)"};
  const allSts=[...new Set(Object.keys(statusCounts))].sort((a,b)=>(stOrder.indexOf(a)+99)%100-(stOrder.indexOf(b)+99)%100);
  const anaContent=`<table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="color:var(--hint);font-size:10px;text-transform:uppercase;letter-spacing:.08em">
        <th style="text-align:left;padding:7px 10px;font-weight:700">Status</th>
        <th style="text-align:center;padding:7px 10px;font-weight:700">Qtd</th>
        <th style="text-align:right;padding:7px 10px;font-weight:700">Valor</th>
        <th style="text-align:right;padding:7px 10px;font-weight:700">% fat.</th>
      </tr></thead><tbody>
      ${allSts.map(st=>{
        const q=statusCounts[st]||0,v=statusVals[st]||0,p=totalFat>0?(v/totalFat*100):0;
        return `<tr style="border-top:1px solid var(--border)">
          <td style="padding:8px 10px;color:${stC[st]||"var(--text)"};font-weight:600">${st||"—"}</td>
          <td style="padding:8px 10px;text-align:center;color:var(--text);font-family:'JetBrains Mono',monospace">${q}</td>
          <td style="padding:8px 10px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(v)}</td>
          <td style="padding:8px 10px;text-align:right;color:var(--muted)">${p.toFixed(1)}%</td>
        </tr>`;
      }).join("")}
      </tbody></table>`;

  el.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-title">Métricas do Funil</div>
        <div class="hdr-sub">base: ${retoCount} compradores (tráfego + orgânico) · atualizado em: ${_dd.updated||"—"}</div>
      </div>
    </div>

    <div class="g4" style="margin-bottom:14px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val kc-val-sm">${fBRL(totalSpend)}</div><div class="kc-sub">Meta Ads</div></div>
      <div class="kc"><div class="kc-lbl">Faturamento total</div><div class="kc-val kc-val-sm">${fBRL(totalFat)}</div></div>
      <div class="kc"><div class="kc-lbl">ROAS funil</div><div class="kc-val kc-val-sm" style="color:${roasC}">${roas.toFixed(2)}x</div></div>
      <div class="kc"><div class="kc-lbl">Compradores</div><div class="kc-val kc-val-sm">${retoCount}</div><div class="kc-sub">aprovados</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Vendas tráfego</div><div class="kc-val kc-val-sm">${countTrafego}</div></div>
      <div class="kc" style="border-color:${statusBorder(cpvTrafego,META_CPV,false)}"><div class="kc-lbl">Custo por venda tráfego</div><div class="kc-val kc-val-sm" style="color:${cpvTrafegoC}">${cpvTrafego>0?fBRL(cpvTrafego):"—"}</div><div class="kc-sub">meta ${fBRL(META_CPV)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas orgânico</div><div class="kc-val kc-val-sm">${countOrganico}</div></div>
      <div class="kc" style="border-color:${statusBorder(cpvTotal,META_CPV_TOTAL,false)}"><div class="kc-lbl">Custo por venda total</div><div class="kc-val kc-val-sm" style="color:${cpvTotalC}">${cpvTotal>0?fBRL(cpvTotal):"—"}</div><div class="kc-sub">meta ${fBRL(META_CPV_TOTAL)}</div></div>
    </div>

    ${(qtdReemb>0||qtdAbrt>0)?`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px">
        ${qtdReemb>0?`<div class="kc"><div class="kc-lbl" style="color:var(--red)">Reembolsos</div><div class="kc-val kc-val-sm" style="color:var(--red)">${qtdReemb} · ${fBRLShort(valReemb)}</div><div class="kc-sub">${pctReemb.toFixed(1)}% do fat.</div></div>`:""}
        ${qtdAbrt>0?`<div class="kc"><div class="kc-lbl" style="color:var(--amber)">Em aberto</div><div class="kc-val kc-val-sm" style="color:var(--amber)">${qtdAbrt} · ${fBRLShort(valAbrt)}</div><div class="kc-sub">${pctAbrt.toFixed(1)}% do fat.</div></div>`:""}
      </div>`:""}

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px">
      <div class="section-lbl">Status / Perdas</div>
      ${anaContent}
    </div>
    <p style="font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace">${PRODUTO_SVO} · Base Vendas + Base Meta (Meta Ads)</p>`;
}

// ── Render Resumo Diário ───────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  // Agrega métricas para um período
  function periodMetrics(s,e){
    const daily=getDailyT(s,e);
    const t=getTotalsT(daily);
    // faturamento (receita) do período — vendas de tráfego
    const dd=D();
    let valor=0;
    for(const d of Object.keys(dd.vendas).filter(d=>d>=s&&d<=e)) valor+=(dd.vendas[d]?.valor||0);
    t.valor=valor;
    t.roas=t.spend>0?valor/t.spend:0;
    t.cpv=t.vendas>0?t.spend/t.vendas:0;
    // Vendas orgânicas do período + total (tráfego + orgânico)
    let qtdOrganico=0;
    for(const d of Object.keys(dd.vendasOrganico||{}).filter(d=>d>=s&&d<=e)) qtdOrganico+=((dd.vendasOrganico||{})[d]?.qtd||0);
    t.vendasOrganico=qtdOrganico;
    t.vendasTotal=t.vendas+qtdOrganico;
    t.cpvTotal=t.vendasTotal>0?t.spend/t.vendasTotal:0;
    return t;
  }

  const tot  = periodMetrics(start, end);
  const ontem= periodMetrics(yest,  yest);
  const hojeBase = periodMetrics(today, today);
  const hoje = {...hojeBase};
  if(S.manualSpendHoje!==null){
    hoje.spend=S.manualSpendHoje;
    hoje.cpv=hoje.vendas>0?hoje.spend/hoje.vendas:0;
    hoje.roas=hoje.spend>0?hoje.valor/hoje.spend:0;
    hoje.cpvTotal=hoje.vendasTotal>0?hoje.spend/hoje.vendasTotal:0;
  }

  // Emoji de status
  function em(val, meta, higher){
    if(val===0) return "";
    const ratio=higher ? val/meta : meta/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85) return "🟡";
    return "🔴";
  }

  // Formata data "dd/mm"
  function fDM(iso){ if(!iso) return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  // Label do período filtrado
  const dateLabel= start===end ? fDM(start) : `${fDM(start)} a ${fDM(end)}`;

  // Bloco de texto formatado para copiar (WhatsApp markdown)
  function block(label, m, isTotal){
    const cpvE     =em(m.cpv,      META_CPV,          false);
    const cpvTotalE=em(m.cpvTotal, META_CPV_TOTAL,    false);
    const pcE   =em(m.txPagChk, METAS_T.txPagChk.val, true);
    const cvE   =em(m.txChkVnd, METAS_T.txChkVnd.val, true);
    const cnE   =em(m.connect,  METAS_T.connect.val,  true);
    const cpcE  =em(m.cpc,      METAS_T.cpc.val,      false);
    const ctrE  =em(m.ctr,      METAS_T.ctr.val,      true);
    const cpmE  =em(m.cpm,      METAS_T.cpm.val,      false);
    return (
`*-> ${label}*
Investimento:\t${fBRL(m.spend)}\t
Vendas tráfego:\t${m.vendas}\t
Custo por venda tráfego:\t${fBRL(m.cpv)}\t${cpvE} R$${META_CPV}
Vendas orgânico:\t${m.vendasOrganico}\t
Vendas total:\t${m.vendasTotal}\t
Custo por venda total:\t${fBRL(m.cpvTotal)}\t${cpvTotalE} R$${META_CPV_TOTAL}

Tx conv PgV-Checkout:\t${m.txPagChk.toFixed(1)}%\t${pcE} ${METAS_T.txPagChk.val}%
Tx conv Checkout-Vendas:\t${m.txChkVnd.toFixed(1)}%\t${cvE} ${METAS_T.txChkVnd.val}%
Connect Rate:\t${m.connect.toFixed(2)}%\t${cnE} ${METAS_T.connect.val}%

CPC:\t${fBRL(m.cpc)}\t${cpcE} R$${METAS_T.cpc.val}
CTR:\t${m.ctr.toFixed(2)}%\t${ctrE} ${METAS_T.ctr.val}%
CPM:\t${fBRL(m.cpm)}\t${cpmE} R$${METAS_T.cpm.val}`
    );
  }

  const resumoText =
`*Sua Vida Em Ordem - Vendas*\t\t

_${dateLabel}_\t\t

${block("Total", tot, true)}

${block("Ontem", ontem, false)}

${block("Hoje", hoje, false)}`;

  // ── Visual ────────────────────────────────────────────────────────────────
  function row(lbl, val, metaVal, emoji){
    const hasVal=val!==null&&val!==undefined;
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${hasVal?val:"—"}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaVal||""}</span></span>
    </div>`;
  }

  function section(label, m, isTotal, isHoje=false){
    const cpvE     =em(m.cpv,      META_CPV,                false);
    const cpvTotalE=em(m.cpvTotal, META_CPV_TOTAL,           false);
    const pcE   =em(m.txPagChk, METAS_T.txPagChk.val,   true);
    const cvE   =em(m.txChkVnd, METAS_T.txChkVnd.val,   true);
    const cnE   =em(m.connect,  METAS_T.connect.val,     true);
    const cpcE  =em(m.cpc,      METAS_T.cpc.val,         false);
    const ctrE  =em(m.ctr,      METAS_T.ctr.val,         true);
    const cpmE  =em(m.cpm,      METAS_T.cpm.val,         false);
    const isManual=isHoje&&S.manualSpendHoje!==null;
    const spendRow=isHoje?`
      <div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Investimento</span>
        <div style="display:flex;align-items:center;gap:6px">
          <input id="manual-spend-input"
            value="${isManual?String(m.spend.toFixed(2)).replace('.',','):''}"
            placeholder="${fBRL(m.spend)}"
            onblur="setManualSpendHoje(this.value||'0')"
            onkeydown="if(event.key==='Enter')this.blur()"
            style="background:${isManual?'rgba(251,191,36,.08)':'var(--surf)'};border:1px solid ${isManual?'rgba(251,191,36,.5)':'var(--border)'};border-radius:6px;color:${isManual?'#fbbf24':'var(--text-strong)'};font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 8px;outline:none;width:120px;transition:all .15s"
            onfocus="this.style.borderColor='rgba(96,165,250,.5)'"
            onblur2="this.style.borderColor='${isManual?'rgba(251,191,36,.5)':'var(--border)'}'">
          ${isManual?`<button onclick="clearManualSpend()" title="Restaurar valor do Sheets" style="font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fbbf24;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:''}
        </div>
        <span style="font-size:13px;min-width:28px;text-align:right">${isManual?'✏️':''}</span>
      </div>`:row("Investimento", fBRL(m.spend), "", "");
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">→ ${label}</div>
      ${spendRow}
      ${row("Vendas tráfego", m.vendas, "", "")}
      ${row("Custo por venda tráfego", fBRL(m.cpv), `meta R$${META_CPV}`, cpvE)}
      ${row("Vendas orgânico", m.vendasOrganico, "", "")}
      ${row("Vendas total", m.vendasTotal, "", "")}
      ${row("Custo por venda total", fBRL(m.cpvTotal), `meta R$${META_CPV_TOTAL}`, cpvTotalE)}
      <div style="height:10px"></div>
      ${row("Tx conv PgV-Checkout", m.txPagChk.toFixed(1)+"%", `meta ${METAS_T.txPagChk.val}%`, pcE)}
      ${row("Tx conv Checkout-Vendas", m.txChkVnd.toFixed(1)+"%", `meta ${METAS_T.txChkVnd.val}%`, cvE)}
      ${row("Connect Rate", m.connect.toFixed(2)+"%", `meta ${METAS_T.connect.val}%`, cnE)}
      <div style="height:10px"></div>
      ${row("CPC", fBRL(m.cpc), `meta R$${METAS_T.cpc.val}`, cpcE)}
      ${row("CTR", m.ctr.toFixed(2)+"%", `meta ${METAS_T.ctr.val}%`, ctrE)}
      ${row("CPM", fBRL(m.cpm), `meta R$${METAS_T.cpm.val}`, cpmE)}
    </div>`;
  }

  // Melhoria 3: variáveis para card de investimento (sem backtick aninhado)
  const _mSpend    = S.manualSpendHoje!==null;
  const _spendVal  = _mSpend ? String(S.manualSpendHoje.toFixed(2)).replace('.',',') : '';
  const _spendPH   = fBRL(hojeBase.spend);
  const _spendBg   = _mSpend ? 'rgba(251,191,36,.08)' : 'var(--surf)';
  const _spendBord = _mSpend ? 'rgba(251,191,36,.5)' : 'var(--border)';
  const _spendCol  = _mSpend ? '#fbbf24' : 'var(--text-strong)';
  const _spendExtra= _mSpend
    ? '<span style="font-size:10px;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:2px 8px;border-radius:5px">&#x270F;&#xFE0F; manual</span>'
      + ' <button onclick="clearManualSpend()" style="font-size:10px;padding:3px 9px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--hint);cursor:pointer">&#x21A9; Restaurar</button>'
    : '<span style="font-size:10px;color:var(--hint)">Edite para substituir o valor do Sheets &middot; Enter para aplicar</span>';

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)}</div>
      </div>
      <div>
        <button onclick="copyResumo()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s" onmouseover="this.style.background='rgba(59,130,246,.28)'" onmouseout="this.style.background='rgba(59,130,246,.18)'">
          📋 Copiar resumo
        </button>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;max-width:560px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap">Hoje — Investimento</span>
      <input id="manual-spend-input"
        value="${_spendVal}"
        placeholder="${_spendPH}"
        onkeydown="if(event.key==='Enter')this.blur()"
        onblur="setManualSpendHoje(this.value||'0');this.style.borderColor='${_spendBord}'"
        onfocus="this.style.borderColor='rgba(96,165,250,.5)'"
        style="background:${_spendBg};border:1px solid ${_spendBord};border-radius:7px;color:${_spendCol};font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 10px;outline:none;width:130px;transition:all .15s">
      ${_spendExtra}
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:560px">
      <pre id="resumo-preview" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${resumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>`;

  // Armazena texto para o botão copiar
  el._resumoText=resumoText;
  // Restaura foco no input manual de investimento
  if(document.activeElement?.id==="manual-spend-input"||_resumoFocus==="manual-spend-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("manual-spend-input");
      if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}
    });
  }
}

function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll("[onclick='copyResumo()']");
    btns.forEach(b=>{const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);});
  }).catch(()=>{ alert("Não foi possível copiar. Selecione o texto manualmente."); });
}

// ── Render Planejamento ────────────────────────────────────────────────────
function renderPlanejamento(){
  const el=document.getElementById("page-planejamento");if(!el)return;
  const _dd=D();
  const daily=getDaily("2000-01-01","2099-12-31").filter(d=>d.spendPlanejado!=null||d.vendasPlanejadas!=null);

  const totInvPlan=daily.reduce((a,d)=>a+(d.spendPlanejado||0),0);
  const totInvReal=daily.reduce((a,d)=>a+d.spend,0);
  const totVndPlan=daily.reduce((a,d)=>a+(d.vendasPlanejadas||0),0);
  const totVndReal=daily.reduce((a,d)=>a+d.vendas,0);
  const hoje=todayISO();
  const totInvPlanAteHoje=daily.reduce((a,d)=>a+(d.date<=hoje?(d.spendPlanejado||0):0),0);
  const totVndPlanAteHoje=daily.reduce((a,d)=>a+(d.date<=hoje?(d.vendasPlanejadas||0):0),0);

  const rows=daily.map(d=>{
    const isFuture=d.date>hoje;
    const invRealC=(!isFuture&&d.spendPlanejado)?statusColor(d.spend,d.spendPlanejado,true):"var(--text)";
    const vndRealC=(!isFuture&&d.vendasPlanejadas)?statusColor(d.vendas,d.vendasPlanejadas,true):"var(--text)";
    return `<tr style="border-top:1px solid var(--border)${d.date===hoje?";background:rgba(96,165,250,.06)":""}">
      <td style="padding:8px 14px;color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace">${fDateBR(d.date)}${d.date===hoje?" 👈":""}</td>
      <td style="padding:8px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${d.spendPlanejado!=null?fBRL(d.spendPlanejado):"—"}</td>
      <td style="padding:8px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${invRealC}">${isFuture&&d.spend===0?"—":fBRL(d.spend)}</td>
      <td style="padding:8px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${d.vendasPlanejadas!=null?d.vendasPlanejadas:"—"}</td>
      <td style="padding:8px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${vndRealC}">${isFuture&&d.vendas===0?"—":d.vendas}</td>
    </tr>`;
  }).join("");

  el.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-title">Planejamento</div>
        <div class="hdr-sub">${daily.length} dias · campanha de tráfego · atualizado em: ${_dd.updated||"—"}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">${statusLegend()}</div>
    </div>
    <div class="g4" style="margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento planejado</div><div class="kc-val kc-val-sm">${fBRL(totInvPlan)}</div></div>
      <div class="kc" style="border-color:${statusBorder(totInvReal,totInvPlan,true)}"><div class="kc-lbl">Investimento realizado</div><div class="kc-val kc-val-sm" style="color:${statusColor(totInvReal,totInvPlan,true)}">${fBRL(totInvReal)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas planejadas</div><div class="kc-val kc-val-sm">${totVndPlan}</div></div>
      <div class="kc" style="border-color:${statusBorder(totVndReal,totVndPlan,true)}"><div class="kc-lbl">Vendas realizadas</div><div class="kc-val kc-val-sm" style="color:${statusColor(totVndReal,totVndPlan,true)}">${totVndReal}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento planejado até hoje</div><div class="kc-val kc-val-sm">${fBRL(totInvPlanAteHoje)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas planejadas até hoje</div><div class="kc-val kc-val-sm">${totVndPlanAteHoje}</div></div>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="color:var(--hint);font-size:10px;text-transform:uppercase;letter-spacing:.08em">
          <th style="text-align:left;padding:9px 14px;font-weight:700">Data</th>
          <th style="text-align:right;padding:9px 14px;font-weight:700">Investimento planejado</th>
          <th style="text-align:right;padding:9px 14px;font-weight:700">Investimento realizado</th>
          <th style="text-align:right;padding:9px 14px;font-weight:700">Vendas planejadas</th>
          <th style="text-align:right;padding:9px 14px;font-weight:700">Vendas realizadas</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h,var(--border));font-weight:700">
            <td style="padding:10px 14px;color:var(--text-strong)">Total</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong)">${fBRL(totInvPlan)}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${statusColor(totInvReal,totInvPlan,true)}">${fBRL(totInvReal)}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong)">${totVndPlan}</td>
            <td style="padding:10px 14px;text-align:right;font-family:'JetBrains Mono',monospace;color:${statusColor(totVndReal,totVndPlan,true)}">${totVndReal}</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="foot">Planejamento da campanha (tráfego) · Base Meta + Base Vendas</p>`;
}

// ── Render ─────────────────────────────────────────────────────────────────

function render(){
  renderHeader();
  const ld=document.getElementById("loading");
  if(S.firstLoad&&S.loading){ld.style.display="flex";return;}
  ld.style.display="none";
  // Painel de erro visível
  const errEl=document.getElementById("err-panel");
  if(errEl){
    if(S.error){
      errEl.style.display="flex";
      errEl.innerHTML=`<div style="background:#1e1014;border:1px solid #f87171;border-radius:12px;padding:24px 28px;max-width:700px;width:100%">
        <div style="color:#f87171;font-weight:700;font-size:15px;margin-bottom:12px">⚠️ Erro ao carregar dados</div>
        <code style="display:block;color:#fca5a5;font-size:12px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;line-height:1.6">${S.error}</code>
        <button onclick="localStorage.removeItem('dash_svo_v1');loadData(true)" style="margin-top:16px;padding:8px 18px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">↻ Tentar novamente</button>
        <button onclick="navigator.clipboard.writeText(${JSON.stringify(JSON.stringify(S.error))})" style="margin-top:16px;margin-left:8px;padding:8px 18px;background:var(--surf);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px">📋 Copiar erro</button>
      </div>`;
      return;
    } else { errEl.style.display="none"; }
  }
  if(S.currentPage==="principal") renderPrincipal();
  else if(S.currentPage==="trafego") renderTrafego();
  else if(S.currentPage==="anuncios") renderAnuncios();
  else if(S.currentPage==="funil") renderFunil();
  else if(S.currentPage==="resumo") renderResumo();
  else if(S.currentPage==="planejamento") renderPlanejamento();

}


render();
loadData();
// ══════════════════════════════════════════════════════════════════════════
</script>
</body>
</html>
