<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SVO - Sua Vida Em Ordem — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e17;--card:#121826;--border:rgba(255,255,255,.07);--border-h:rgba(255,255,255,.12);
  --text:#e8edf6;--text-strong:#f1f5fb;--muted:#8a96ab;--hint:#6b7689;
  --accent:#3b82f6;--accent-bg:rgba(59,130,246,.16);
  --green:#34d399;--amber:#fbbf24;--red:#f87171;
  --surf:rgba(255,255,255,.03);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

/* ─── App Header ─────────────────────────────────────────────────── */
.app-hdr{position:sticky;top:0;z-index:20;background:rgba(12,17,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:0 26px;height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}

/* Funil dropdown */
.funil-wrap{position:relative}
.funil-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surf);cursor:pointer;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;transition:border-color .15s}
.funil-btn:hover{border-color:var(--border-h)}
.funil-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.funil-name{font-size:12px;font-weight:600;color:var(--text-strong)}
.funil-status{font-size:9px;color:var(--green);letter-spacing:.04em}
.funil-chevron{color:var(--muted);font-size:10px;margin-left:2px}
.funil-menu{position:absolute;top:calc(100% + 6px);left:0;background:#1a2236;border:1px solid var(--border-h);border-radius:10px;padding:4px;min-width:180px;box-shadow:0 6px 30px rgba(2,6,20,.45);z-index:100}
.funil-opt{padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);transition:all .12s;display:flex;align-items:center;gap:8px}
.funil-opt:hover{background:var(--accent-bg);color:var(--text)}
.funil-opt.fopt-active{background:var(--accent-bg);color:#cfe0ff}
.fopt-dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.funil-opt.fopt-active .fopt-dot{background:var(--green)}

/* Nav tabs */
.hdr-tabs{display:flex;align-items:center;gap:4px}
.htab{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:none;background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;color:var(--muted);transition:all .15s;white-space:nowrap}
.htab:hover{color:var(--text)}
.htab.htab-active{background:rgba(59,130,246,.16);color:#fff}
.htab-icon{font-size:13px}

/* Period controls */
.hdr-right{display:flex;align-items:center;gap:8px}
.presets{display:flex;gap:4px}
.btn-pre{background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 11px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .12s;white-space:nowrap}
.btn-pre:hover{border-color:var(--border-h);color:var(--text)}
.btn-pre.on{background:rgba(59,130,246,.16);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}
.drbox{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .15s;padding:0 6px;gap:3px}
.drbox:focus-within{border-color:rgba(96,165,250,.5)}
.drbox-icon{color:var(--hint);font-size:12px;user-select:none}
.drbox input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:5px 4px;cursor:pointer;color-scheme:dark;width:100px}
.drbox-sep{color:var(--hint);font-size:11px;user-select:none}
.btn-update{background:rgba(59,130,246,.16);border:1px solid rgba(96,165,250,.3);color:#60a5fa;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:600;transition:all .15s;white-space:nowrap;box-shadow:0 0 16px rgba(59,130,246,.2)}
.btn-update:hover:not(:disabled){box-shadow:0 0 16px rgba(59,130,246,.4)}
.btn-update:disabled{opacity:.4;cursor:not-allowed}

/* ─── Content ────────────────────────────────────────────────────── */
.app-content{max-width:1640px;margin:0 auto;padding:22px 30px 40px}
.page{display:none}.page.active{display:block}

/* Page header */
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.hdr-title{font-size:22px;font-weight:700;font-family:'Sora',sans-serif;color:var(--text-strong);line-height:1.25}
.hdr-sub{margin-top:5px;font-size:11px;color:var(--hint);font-family:'JetBrains Mono',monospace}
.err{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--red);line-height:1.5}

/* KPIs */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.kc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.kc:hover{border-color:var(--border-h)}
.kc-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:700}
.kc-val{font-family:'JetBrains Mono',monospace;font-weight:600;letter-spacing:-.02em;font-size:22px;line-height:1.1;color:var(--text-strong)}
.kc-val-sm{font-size:18px}
.kc-sub{font-size:10px;color:var(--hint);margin-top:5px;font-family:'JetBrains Mono',monospace}
.kc-date{font-size:9px;color:var(--hint);margin-bottom:4px;font-family:'JetBrains Mono',monospace;font-weight:500}

/* Section label */
.section-lbl{font-size:9px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px;margin-top:20px}

/* Status legend */
.status-legend{display:flex;gap:16px;margin-bottom:14px}
.sl{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--hint)}
.sl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* Charts */
.cc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px 14px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.lg{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}
.ll{width:14px;height:2px;border-radius:2px}
.ld{width:7px;height:7px;border-radius:50%}
.charts-2x2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.charts-2x3{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}

/* Toggle overlay buttons */
.overlay-btns{display:flex;gap:6px}
.btn-overlay{font-size:10px;padding:3px 10px;border-radius:5px;border:1px solid var(--border-h);color:var(--muted);background:transparent;cursor:pointer;transition:all .12s;font-family:'DM Sans',sans-serif}
.btn-overlay:hover{border-color:var(--accent);color:var(--text)}
.btn-overlay.on{background:var(--accent-bg);border-color:rgba(96,165,250,.4);color:#60a5fa;font-weight:600}

/* Tooltip */
.tip{background:#1a2236;border:1px solid var(--border-h);border-radius:8px;padding:10px 13px;font-size:12px;box-shadow:0 4px 16px rgba(2,6,20,.45);display:none;position:absolute;pointer-events:none;z-index:20;min-width:150px}
.tl{color:var(--hint);margin-bottom:5px;font-weight:500;font-size:10px;font-family:'JetBrains Mono',monospace}
.tr{display:flex;justify-content:space-between;gap:14px;margin-bottom:2px;font-size:11px}
.tv{color:var(--text-strong);font-weight:600;font-family:'JetBrains Mono',monospace}

/* Spinner */
.sw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.sp{width:32px;height:32px;border:2px solid var(--border);border-top:2px solid var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.st{color:var(--hint);font-size:13px}
.foot{margin-top:18px;font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace;opacity:.5}
canvas{display:block}
input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer;filter:invert(1)}

/* Quick period inside pages (funil / análise) */
.period-wrap{margin-bottom:18px}
.period-top{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.period-lbl{font-size:9px;color:var(--hint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.drbox-sm{display:flex;align-items:center;background:var(--surf);border:1px solid var(--border);border-radius:7px;overflow:hidden;gap:2px;padding:0 5px}
.drbox-sm input[type=date]{background:transparent;border:none;outline:none;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 4px;cursor:pointer;color-scheme:dark;width:96px}
.period-quick{display:flex;gap:5px;flex-wrap:wrap}
.btn-q{background:transparent;border:1px solid var(--border);color:var(--hint);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all .12s;white-space:nowrap}
.btn-q:hover{border-color:var(--border-h);color:var(--text)}
.btn-q.on{background:var(--accent-bg);border-color:rgba(96,165,250,.35);color:#cfe0ff;font-weight:600}

/* Análise sub-tabs */
.ana-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px;gap:0}
.ana-tab{padding:7px 14px;font-size:11px;font-weight:500;color:var(--hint);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s}
.ana-tab:hover{color:var(--text)}
.ana-tab.active{color:#60a5fa;border-bottom-color:#3b82f6}

/* ─── Mobile Responsive ────────────────────────────────────────── */
@media(max-width:768px){
  /* ── Header ── */
  .app-hdr{
    height:auto;flex-wrap:wrap;
    padding:0;gap:0;align-items:stretch;
  }
  .funil-wrap{
    padding:9px 14px;flex-shrink:0;
    border-bottom:1px solid var(--border);
    width:auto;
  }
  .hdr-right{
    order:2;flex:1;min-width:0;
    display:flex;align-items:center;gap:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    padding:8px 14px 8px 8px;flex-wrap:nowrap;
    border-bottom:1px solid var(--border);
  }
  .hdr-right::-webkit-scrollbar{display:none}
  .presets{flex-wrap:nowrap;gap:3px}
  .btn-pre{font-size:10px;padding:4px 8px;flex-shrink:0}
  .drbox{flex-shrink:0}
  .drbox input[type=date]{width:86px;font-size:10px}
  .btn-update{font-size:11px;padding:5px 10px;flex-shrink:0}
  .hdr-tabs{
    order:3;width:100%;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    flex-wrap:nowrap;gap:2px;
    padding:6px 14px 8px;
  }
  .hdr-tabs::-webkit-scrollbar{display:none}
  .htab{flex-shrink:0;font-size:11px;padding:5px 10px}
  .htab-icon{font-size:12px}

  /* ── Content ── */
  .app-content{padding:14px 10px 30px;max-width:100%}
  .hdr{flex-direction:column;gap:6px;margin-bottom:14px}
  .hdr-title{font-size:18px}

  /* ── KPI Grids ── */
  .g3,.g4,.g5{
    grid-template-columns:repeat(2,1fr)!important;
    gap:8px!important;
  }
  .kc{padding:12px 13px}
  .kc-val{font-size:18px}
  .kc-val-sm{font-size:15px}

  /* ── Inline repeat grids (render functions) ── */
  [style*="repeat(3,1fr)"],[style*="repeat(4,1fr)"],
  [style*="repeat(5,1fr)"],[style*="repeat(6,1fr)"],
  [style*="repeat(7,1fr)"],[style*="repeat(8,1fr)"]{
    grid-template-columns:repeat(2,1fr)!important;
    gap:8px!important;
  }
  /* 2-column side-by-side layouts → single column */
  [style*="1fr 1fr"]{grid-template-columns:1fr!important}
  /* Funil SVG + cards sidebar → stack */
  [style*="1fr 260px"]{grid-template-columns:1fr!important}
  /* Resumo diário 2-col → stack */
  [style*="220px 1fr"]{grid-template-columns:1fr!important}

  /* ── Charts ── */
  .charts-2x2,.charts-2x3{
    grid-template-columns:1fr!important;
    gap:10px!important;
  }

  /* ── Tables: allow horizontal scroll ── */
  .page div[style*="overflow:hidden"]{
    overflow-x:auto!important;
    -webkit-overflow-scrolling:touch;
  }
  .page table{font-size:10px!important}
  .page td,.page th{
    padding:7px 8px!important;
    white-space:nowrap;
  }
  /* First column (names/labels) can wrap */
  .page td:first-child,.page th:first-child{
    white-space:normal;
    min-width:90px;max-width:140px;
  }

  /* ── Status legend ── */
  .status-legend{flex-wrap:wrap;gap:8px}

  /* ── Period quick buttons ── */
  .period-quick{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .period-quick::-webkit-scrollbar{display:none}
  .btn-q{flex-shrink:0;font-size:10px;padding:3px 9px}

  /* ── Ana sub-tabs ── */
  .ana-tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
  .ana-tabs::-webkit-scrollbar{display:none}
  .ana-tab{flex-shrink:0;font-size:10px;padding:6px 10px}

  /* ── Section label spacing ── */
  .section-lbl{margin-top:16px}
}
</style>
</head>
<body>
<!-- ─── App Header ───────────────────────────────────────────────── -->
<header class="app-hdr">
  <!-- Left: funil selector -->
  <div class="funil-wrap" id="funil-wrap">
    <button class="funil-btn" id="funil-btn" onclick="toggleFunilMenu(event)">
      <span class="funil-dot" id="funil-dot"></span>
      <div>
        <div class="funil-name" id="funil-name">SVO - Libertas</div>
        <div class="funil-status" id="funil-status">ativo</div>
      </div>
      <span class="funil-chevron">▾</span>
    </button>
    <div class="funil-menu" id="funil-menu" style="display:none">
      <div class="funil-opt fopt-active" id="fopt-set26" onclick="selectEdicao('set26')"><span class="fopt-dot"></span>SVO - Set/26 (ao vivo)</div>
      <div class="funil-opt" id="fopt-ago26" onclick="selectEdicao('ago26')"><span class="fopt-dot"></span>SVO - Ago/26 (debriefing)</div>
    </div>
  </div>

  <!-- Center: navigation tabs -->
  <nav class="hdr-tabs" id="hdr-tabs">
    <button class="htab htab-active" id="htab-principal" onclick="navTo('principal')"><span class="htab-icon">⊞</span>Principal</button>
    <button class="htab" id="htab-trafego" onclick="navTo('trafego')"><span class="htab-icon">⟳</span>Métricas tráfego</button>
    <button class="htab" id="htab-funil" onclick="navTo('funil')"><span class="htab-icon">▽</span>Métricas do funil</button>
    <button class="htab" id="htab-anuncios" onclick="navTo('anuncios')"><span class="htab-icon">◈</span>Anúncios</button>
  </nav>

  <!-- Right: period + refresh -->
  <div class="hdr-right" id="hdr-right">
    <div class="presets" id="hdr-presets">
      <button class="btn-pre" id="hpre-hoje" onclick="applyQuickCurrent('hoje')">Hoje</button>
      <button class="btn-pre" id="hpre-ontem" onclick="applyQuickCurrent('ontem')">Ontem</button>
      <button class="btn-pre" id="hpre-7d" onclick="applyQuickCurrent('7d')">7 dias</button>
      <button class="btn-pre on" id="hpre-30d" onclick="applyQuickCurrent('30d')">30 dias</button>
      <button class="btn-pre" id="hpre-mes" onclick="applyQuickCurrent('mes')">Este mês</button>
    </div>
    <div class="drbox">
      <span class="drbox-icon">📅</span>
      <input type="date" id="hdr-start" onchange="onDCCurrent('s',this.value)"/>
      <span class="drbox-sep">→</span>
      <input type="date" id="hdr-end" onchange="onDCCurrent('e',this.value)"/>
    </div>
    <button class="btn-update" id="btn-update" onclick="loadData(true)">↻ Atualizar</button>
  </div>
</header>

<!-- ─── Content ──────────────────────────────────────────────────── -->
<div class="app-content" id="app-content">
  <div class="sw" id="loading"><div class="sp"></div><p class="st">Carregando dados...</p></div>
  <div id="err-panel" style="display:none;align-items:flex-start;justify-content:center;padding:40px 24px"></div>
  <div id="page-principal"       class="page active"></div>
  <div id="page-funil"           class="page"></div>
  <div id="page-trafego"         class="page"></div>
  <div id="page-anuncios"        class="page"></div>
  <div id="page-resumo"          class="page"></div>
  <div id="page-planejamento"    class="page"></div>
</div>

// As duas edições são 100% independentes: a de Ago/26 é um HTML autocontido
// (próprio <style>/<script>/estado/JSON de dados, sem fetch) embutido em base64
// e carregado num <iframe> isolado — não compartilha variáveis, funções, CSS
// nem DOM com o app "ao vivo" deste arquivo. Trocar de edição aqui só
// esconde/mostra: nenhum dos dois códigos é executado, pausado ou alterado
// pelo outro.
let CURRENT_EDICAO="set26";
let _ago26Loaded=false;
function decodeAgo26Html(){
  const bin=atob(AGO26_HTML_B64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

// ── Date helpers (UTC-3 Brasília) ───────────────────────────────────────────
function nowSP(){ return new Date(Date.now()-3*60*60*1000); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowSP()); }
function yesterdayISO(){ const d=nowSP();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowSP();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowSP();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00Z");d.setDate(d.getDate()+n);return toISODate(d); }
function subDays(iso,n){ return addDays(iso,-n); }

// ── Format helpers ─────────────────────────────────────────────────────────
function parseBRL(s){ if(!s||s==="-"||s==="0")return 0;return parseFloat(String(s).replace(/R\$\s*/g,"").replace(/\./g,"").replace(",",".").trim())||0; }
function parseBRLAbs(s){ return Math.abs(parseBRL(s)); }

// Normaliza status numérico da Eduzz para texto
function normalizeStatus(s){
  if(!s && s!==0) return "";
  const m={
    "1":"Aberta",
    "3":"Paga",
    "6":"Aguardando Reembolso",
    "7":"Reembolsado",
    "10":"Expirado",
    "11":"Em Recuperacao",
    "15":""
  };
  const str=String(s).trim();
  return m[str]||str;
}

// Extrai só a data de strings com ou sem horário: "dd/mm/yyyy HH:MM:SS" → "dd/mm/yyyy"
function stripTime(s){
  if(!s) return s;
  return String(s).trim().split(" ")[0];
}
function toISO(s){ if(!s||s==="Date"||s==="")return null;s=String(s).trim().split(" ")[0]; if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const p=s.split("/");if(p.length===3){const y=p[2].length===4?p[2]:"20"+p[2];return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;}return null; }
function fBRL(n){ return "R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fBRLShort(n){ const a=Math.abs(n||0),sg=n<0?"-":"";if(a>=1000)return sg+"R$"+(a/1000).toFixed(1).replace(".",",")+"k";return sg+"R$"+Math.round(a); }
function fPct(n){ return (n||0).toFixed(1)+"%"; }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function parseSheet(json){ const rows=json.values||[];if(rows.length<2)return[];const h=rows[0];return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()]))); }

// Status color — dark mode semantics
function statusColor(val,meta,higherIsBetter){
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
// Card border color from status color
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.22)";
  if(c==="#fbbf24") return "rgba(251,191,36,.22)";
  if(c==="#f87171") return "rgba(248,113,113,.22)";
  return "var(--border)";
}

// ── Ad ID / advCode helpers ───────────────────────────────────────────────
// Extrai código adv/adi/adc + dígitos do nome do anúncio
// Ignora prefixo "teste-"
function extractAdvCode(name){
  if(!name) return null;
  // remove prefixo teste- case-insensitive
  const clean=name.replace(/^teste-/i,"");
  // Formato SVO: "AD#004_..." → "ad004" (agrupa variações V1/V2 do mesmo ad)
  const mSvo=clean.match(/ad#(\d+)/i);
  if(mSvo) return "ad"+mSvo[1];
  // Formato antigo: "adv123" / "adi123" / "adc123"
  const m=clean.match(/ad[vic]\d+/i);
  return m ? m[0].toLowerCase() : null;
}

// Extrai país do Adset Name.
// Convenção: "ca01-aberto-{pais}" → país; caso contrário → "Brasil"
function extractCountryFromAdset(adsetName){
  if(!adsetName) return "Brasil";
  // Padrão ca{N}-{word}-{country}, captura o último segmento após o segundo "-"
  const m=adsetName.match(/^ca\d+-.+-([a-z_]+)$/i);
  if(m){
    const slug=m[1].replace(/_/g," ");
    if(slug.toUpperCase()==="EUA") return "EUA";
    // Title-case cada palavra
    return slug.replace(/\b\w/g,c=>c.toUpperCase());
  }
  return "Brasil";
}

// Extrai a temperatura do público a partir do nome da campanha.
// Convenção observada nas campanhas SVO: "svo-vendas-advtg-frio-21jul", "svo-vendas-quente-21jul"...
function campTemperature(campName){
  const n=(campName||"").toLowerCase();
  if(/frio/.test(n))   return "frio";
  if(/morno/.test(n))  return "morno";
  if(/quente/.test(n)) return "quente";
  return null;
}

// Extrai Ad ID numérico de 15-20 dígitos de uma string que pode ser:
// "120247448870650228" ou "manual_defin-venda-adv289|120247448870650228::..."
function extractAdId(raw){
  if(!raw) return null;
  // já é um número puro
  if(/^\d{15,20}$/.test(raw.trim())) return raw.trim();
  // busca sequência de 15-20 dígitos
  const m=raw.match(/\d{15,20}/);
  return m ? m[0] : null;
}


// ── SVO Vendas helpers ────────────────────────────────────────────────────
// Extrai plataforma/posicionamento do utm.source (formato "FBAds_{Platform}_{Placement}")
function extractPlatformPlacement(src){
  if(!src) return {platform:"",placement:""};
  const parts=String(src).split("_").filter(Boolean);
  if(parts.length<2) return {platform:"",placement:""};
  const platform=(parts[1]||"").toLowerCase();
  const placement=parts.slice(2).join(" ")||"";
  return {platform,placement};
}

// Normaliza status do checkout SVO → texto interno
function normalizeVendaStatus(s){
  if(!s) return "";
  const m={
    "PAID":"Paga","APPROVED":"Paga","COMPLETED":"Paga",
    "REFUNDED":"Reembolsado","CHARGEBACK":"Reembolsado","CANCELED":"Reembolsado","CANCELLED":"Reembolsado",
    "PENDING":"Aberta","WAITING_PAYMENT":"Aberta","PROCESSING":"Aberta","WAITING":"Aberta",
    "EXPIRED":"Expirado","DELAYED":"Expirado",
  };
  return m[String(s).toUpperCase().trim()]||String(s).trim();
}

// Converte timestamp ISO (UTC) do webhook para data local (Brasília, UTC-3).
// O timestamp salvo vem 3h à frente do horário real → subtrai 3h antes de extrair a data.
function vendaTsToISO(iso){
  if(!iso) return null;
  const d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  const local=new Date(d.getTime()-3*60*60*1000);
  return local.toISOString().split("T")[0];
}

// Parseia aba "Base Vendas" do SVO (formato event.invoice.*) — valores já em BRL, sem conversão de moeda
function parseVendasRows(sheetJ){
  return parseSheet(sheetJ).map(r=>{
    const tsRaw=r["event.invoice.statusAt[0].when"]||"";
    const d=vendaTsToISO(tsRaw);
    const st=normalizeVendaStatus(r["event.invoice.status"]||"");
    const content=r["event.invoice.paymentSession.utm.content"]||"";
    const adId=extractAdId(content)||"";
    const utmSource=r["event.invoice.paymentSession.utm.source"]||"";
    const {platform:_plat,placement:_plac}=extractPlatformPlacement(utmSource);
    const cents=parseFloat(String(r["event.invoice.amount.subtotalCents"]||"0").replace(",","."))||0;
    const valor=cents/100;
    const rawEmail=(r["event.invoice.payer.email"]||"").trim();
    const rawPhone=(r["event.invoice.payer.phone"]||"").replace(/\D/g,"");
    // Canal: UTM com FBAds ou sem UTM → tráfego; qualquer outra UTM → orgânico
    const _channel=(!utmSource.trim()||/^fbads/i.test(utmSource.trim()))?"trafego":"organico";
    return {
      "Email":rawEmail.toLowerCase(),
      "CPF Comprador":"",
      "Telefone":rawPhone,
      "Nome":r["event.invoice.payer.lastName"]||"",
      "Status da compra":st,
      "Data da compra":d||"",
      "Nome do produto":PRODUTO_SVO,
      "Valor do produto":valor.toFixed(2),
      "Taxa da plataforma":"0",
      "Ad Id":adId,
      _src:"svo",
      _channel,
      platform:_plat,
      placement:_plac,
      _orderDate:tsRaw,
    };
  }).filter(r=>r["Data da compra"])
    // Dedup por timestamp: mesma compra pode gerar mais de um evento; prefere o que tem email real
    .reduce((acc,r)=>{
      const key=r._orderDate||r["Data da compra"];
      const i=acc.findIndex(x=>(x._orderDate||x["Data da compra"])===key);
      if(i<0){ acc.push(r); }
      else{
        const hasEmail=r["Email"]&&r["Email"].includes("@");
        const existingEmail=acc[i]["Email"]&&acc[i]["Email"].includes("@");
        if(!existingEmail&&hasEmail) acc[i]=r;
      }
      return acc;
    },[]);
}

// ── Load data ──────────────────────────────────────────────────────────────
// Busca uma aba em blocos de 5000 linhas para evitar timeout em abas grandes
// ── CSV parser → mesmo formato que a Sheets API {values:[rows]} ───────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(inQ&&line[i+1]==='"'){cur+='"';i++;}
        else inQ=!inQ;
      } else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return {values:result};
}

async function fetchCSV(filename){
  console.log(`[csv] carregando "${filename}"...`);
  const res=await fetch("./"+encodeURIComponent(filename));
  if(!res.ok) throw new Error(`HTTP ${res.status} ao carregar "${filename}"`);
  const text=await res.text();
  const j=parseCSVText(text);
  console.log(`[csv] "${filename}": ${j.values.length-1} linhas de dados`);
  return j;
}

async function fetchCSVSafe(filename){
  return fetchCSV(filename).catch(e=>{
    console.warn(`[csv] "${filename}" não encontrado:`,e.message);
    return {values:[]};
  });
}

// ── Sheets API helpers ──────────────────────────────────────────────────────
async function fetchSheetPaged(tab, lastCol="L", pageSize=5000){
  const allValues=[];
  let startRow=1;
  while(true){
    const endRow=startRow+pageSize-1;
    const range=`${encodeURIComponent(tab)}!A${startRow}:${lastCol}${endRow}`;
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${GAPI_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error(`Sheets API: HTTP ${res.status} ao buscar aba "${tab}"`);
    const data=await res.json();
    const rows=data.values||[];
    allValues.push(...rows);
    if(rows.length<pageSize) break;
    startRow+=pageSize;
  }
  return {values:allValues};
}

        if(igUrl && !mByAdId[adId].byDate[d].igUrl) mByAdId[adId].byDate[d].igUrl=igUrl;
        if(!mByAdId[adId].lastStatusDate||d>mByAdId[adId].lastStatusDate){
          mByAdId[adId].adStatus=adStatusR; mByAdId[adId].campStatus=campStatusR;
          mByAdId[adId].adsetStatus=adsetStatusR; mByAdId[adId].lastStatusDate=d;
        }
      }
      // Agrupa por país (derivado do adset name)
      if(adId){
        if(!mByCountry[country]) mByCountry[country]={country,adIds:new Set(),spend:0,clicks:0,impressions:0,ic:0};
        mByCountry[country].spend       += spendV;
        mByCountry[country].clicks      += clicksV;
        mByCountry[country].impressions += impressV;
        mByCountry[country].ic          += icV;
        mByCountry[country].adIds.add(adId);
        if(pubPlatform){
          if(!mByPlatform[pubPlatform])mByPlatform[pubPlatform]={platform:pubPlatform,spend:0,clicks:0,impressions:0};
          mByPlatform[pubPlatform].spend      +=spendV;
          mByPlatform[pubPlatform].clicks     +=clicksV;
          mByPlatform[pubPlatform].impressions+=impressV;
          const rowTemp=campTemperature(campName);
          if(rowTemp&&mByPlatformByTemp[rowTemp]){
            const mpt=mByPlatformByTemp[rowTemp];
            if(!mpt[pubPlatform])mpt[pubPlatform]={platform:pubPlatform,spend:0,clicks:0,impressions:0};
            mpt[pubPlatform].spend      +=spendV;
            mpt[pubPlatform].clicks     +=clicksV;
            mpt[pubPlatform].impressions+=impressV;
          }
        }
      }
      // Agrupa por campanha
      if(campName&&campName!=="—"){
        if(!mByCamp[campName])mByCamp[campName]={campName,adIds:new Set(),spend:0,clicks:0,impressions:0,ic:0,campStatus:"",lastStatusDate:""};
        mByCamp[campName].spend       += spendV;
        mByCamp[campName].clicks      += clicksV;
        mByCamp[campName].impressions += impressV;
        mByCamp[campName].ic          += icV;
        if(!mByCamp[campName].lastStatusDate||d>mByCamp[campName].lastStatusDate){
          mByCamp[campName].campStatus=campStatusR; mByCamp[campName].lastStatusDate=d;
        }
        if(adId) mByCamp[campName].adIds.add(adId);
        if(!mByCampByDate[campName]) mByCampByDate[campName]={};
        if(!mByCampByDate[campName][d]) mByCampByDate[campName][d]={spend:0,clicks:0,impressions:0,ic:0,adIds:new Set()};
        mByCampByDate[campName][d].spend       += spendV;
        mByCampByDate[campName][d].clicks      += clicksV;
        mByCampByDate[campName][d].impressions += impressV;
        mByCampByDate[campName][d].ic          += icV;
        if(adId) mByCampByDate[campName][d].adIds.add(adId);
      }
    }

    S.meta=mD; S.metaByAd=mByAd; S.metaByAdByDate=mByAdByDate;
    S.metaByCamp=mByCamp; S.metaByCampByDate=mByCampByDate;
    S.metaByAdId=mByAdId; S.metaByCountry=mByCountry; S.metaByPlatform=mByPlatform;
    S.metaByPlatformByTemp=mByPlatformByTemp;

    // ── Vendas SVO ───────────────────────────────────────────────────────
    // Canal: UTM com FBAds (ou sem UTM) = tráfego; qualquer outra UTM = orgânico.
    // Toda a dashboard (exceto a aba "Métricas do funil") usa só vendas de tráfego.
    const retoRows=parseVendasRows(vendasJ);
    const trafegoRows=retoRows.filter(r=>r._channel==="trafego");
    const organicoRows=retoRows.filter(r=>r._channel==="organico");

    const vD={}, vByAd={}, vByAdDate={};
    for(const r of trafegoRows){
      if(r["Status da compra"]!=="Paga") continue;
      const d=r["Data da compra"]; if(!d)continue;
      const valor=parseFloat(r["Valor do produto"])||0;
      if(!vD[d])vD[d]={qtd:0,valor:0,taxa:0};
      vD[d].qtd+=1; vD[d].valor+=valor;
      const adId=r["Ad Id"];
      if(adId){
        if(!vByAd[adId])vByAd[adId]={qtd:0,valor:0,taxa:0};
        vByAd[adId].qtd+=1; vByAd[adId].valor+=valor;
        if(!vByAdDate[adId])vByAdDate[adId]={};
        if(!vByAdDate[adId][d])vByAdDate[adId][d]={qtd:0,valor:0,taxa:0};
        vByAdDate[adId][d].qtd+=1; vByAdDate[adId][d].valor+=valor;
      }
    }
    // Vendas orgânicas — usadas só no gráfico "Vendas do orgânico" da Principal
    const vDOrganico={};
    for(const r of organicoRows){
      if(r["Status da compra"]!=="Paga") continue;
      const d=r["Data da compra"]; if(!d)continue;
      const valor=parseFloat(r["Valor do produto"])||0;
      if(!vDOrganico[d])vDOrganico[d]={qtd:0,valor:0,taxa:0};
      vDOrganico[d].qtd+=1; vDOrganico[d].valor+=valor;
    }
    const vByPlatform={}, vByPlacement={};
    const vByPlatformByTemp={frio:{},morno:{},quente:{}};
    const vByPlacementByTemp={frio:{},morno:{},quente:{}};
    for(const r of trafegoRows){
      if(r["Status da compra"]!=="Paga") continue;
      const d=r["Data da compra"]; if(!d||d<S.startDate||d>S.endDate) continue;
      const valor=parseFloat(r["Valor do produto"])||0;
      const plat=r.platform||"";
      const plac=r.placement||"";
      const rAdId=r["Ad Id"];
      const rTemp=rAdId?campTemperature(mByAdId[rAdId]?.campName):null;
      if(plat){
        if(!vByPlatform[plat])vByPlatform[plat]={qtd:0,valor:0};
        vByPlatform[plat].qtd+=1; vByPlatform[plat].valor+=valor;
        if(rTemp&&vByPlatformByTemp[rTemp]){
          if(!vByPlatformByTemp[rTemp][plat])vByPlatformByTemp[rTemp][plat]={qtd:0,valor:0};
          vByPlatformByTemp[rTemp][plat].qtd+=1; vByPlatformByTemp[rTemp][plat].valor+=valor;
        }
      }
      if(plac&&!plac.includes("{{"+"}")&&plac!=="Others"&&plac!=="unknown"){
        if(!vByPlacement[plac])vByPlacement[plac]={qtd:0,valor:0};
        vByPlacement[plac].qtd+=1; vByPlacement[plac].valor+=valor;
        if(rTemp&&vByPlacementByTemp[rTemp]){
          if(!vByPlacementByTemp[rTemp][plac])vByPlacementByTemp[rTemp][plac]={qtd:0,valor:0};
          vByPlacementByTemp[rTemp][plac].qtd+=1; vByPlacementByTemp[rTemp][plac].valor+=valor;
        }
      }
    }
    S.vendasByPlatform=vByPlatform; S.vendasByPlacement=vByPlacement;
    S.vendasByPlatformByTemp=vByPlatformByTemp; S.vendasByPlacementByTemp=vByPlacementByTemp;
    S.vendas=vD; S.vendasByAd=vByAd; S.vendasByAdDate=vByAdDate;
    S.vendasOrganico=vDOrganico;

    // ── Funil: SVO (produto único, sem upsell/ascensão) ─────────────────────
    // Usa TODAS as vendas (tráfego + orgânico) — única aba com essa exceção.
    S.funilRows=retoRows;
    try{ S.funil=buildFunilData(S.funilRows,S.startDate||"",S.endDate||""); }
    catch(fe){ console.error("buildFunilData error:",fe); S.funil={}; }

    // ── Última venda ───────────────────────────────────────────────────────
    let lastISO="";
    for(const r of retoRows){
      if(r["Status da compra"]!=="Paga") continue;
      const d=r["Data da compra"]||""; if(d>lastISO) lastISO=d;
    }

    S.updated=lastISO?fDateBR(lastISO):"—";

    S.firstLoad=false;
  }catch(e){
    S.error="Erro ao processar dados: "+e.message;
    S.firstLoad=false;
    console.error("processing error:",e);
  }
  render();
}

// Agrega meta (spend/clicks/impressions/landingViews/checkouts, por adId via metaByAdId)
// e vendas (por adId, via vendasByAdDate) filtrando somente os ads cuja campanha tem a
// temperatura informada. Vendas orgânicas não têm campanha/anúncio associado, então não
// entram em nenhuma temperatura.
const _tempCache={};
function getMetaVendasByTemp(temp){
  if(_tempCache[temp]) return _tempCache[temp];
  const d=D();
  const metaByDate={}, vendasByDate={};
  for(const adId in (d.metaByAdId||{})){
    const ad=d.metaByAdId[adId];
    if(campTemperature(ad.campName)!==temp) continue;
    for(const date in (ad.byDate||{})){
      const b=ad.byDate[date];
      if(!metaByDate[date]) metaByDate[date]={spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0};
      metaByDate[date].spend        +=b.spend||0;
      metaByDate[date].clicks       +=b.clicks||0;
      metaByDate[date].impressions  +=b.impressions||0;
      metaByDate[date].landingViews +=b.landingViews||0;
      metaByDate[date].checkouts    +=b.ic||0;
    }
    const vByD=d.vendasByAdDate[adId]||{};
    for(const date in vByD){
      if(!vendasByDate[date]) vendasByDate[date]={qtd:0,valor:0,taxa:0};
      vendasByDate[date].qtd  +=vByD[date].qtd  ||0;
      vendasByDate[date].valor+=vByD[date].valor||0;
      vendasByDate[date].taxa +=vByD[date].taxa ||0;
    }
  }
  return (_tempCache[temp]={metaByDate, vendasByDate});
}

function getDaily(start,end,temp=null){
  const d=D();
  const isTemp=temp&&temp!=="consolidado";
  const tempData=isTemp?getMetaVendasByTemp(temp):null;
  const spendSrc=isTemp?Object.fromEntries(Object.entries(tempData.metaByDate).map(([k,v])=>[k,v.spend])):Object.fromEntries(Object.entries(d.meta).map(([k,v])=>[k,v.spend]));
  const vendasSrc=isTemp?tempData.vendasByDate:d.vendas;
  const all=new Set([...Object.keys(spendSrc),...Object.keys(vendasSrc),...Object.keys(d.vendasOrganico||{}),...Object.keys(VENDAS_PLANEJADAS),...Object.keys(INVESTIMENTO_PLANEJADO)]);
  return Array.from(all).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const spend=spendSrc[date]||0;
    const v=vendasSrc[date]||{qtd:0,valor:0,taxa:0};
    // Orgânico não pertence a nenhuma temperatura específica — só aparece na visão consolidada.
    const vo=isTemp?{qtd:0,valor:0,taxa:0}:((d.vendasOrganico||{})[date]||{qtd:0,valor:0,taxa:0});
    const lucro=v.valor-v.taxa-(spend*TAXA_IMPOSTO);
    return{date,label:fDate(date),spend,faturamento:v.valor,vendas:v.qtd,
      spendPlanejado: date in INVESTIMENTO_PLANEJADO ? INVESTIMENTO_PLANEJADO[date] : null,
      vendasOrganico:vo.qtd,faturamentoOrganico:vo.valor,
      vendasPlanejadas: date in VENDAS_PLANEJADAS ? VENDAS_PLANEJADAS[date] : null,
      roas:spend>0?v.valor/spend:0,cpv:v.qtd>0?spend/v.qtd:0,
      ticket:v.qtd>0?v.valor/v.qtd:0,lucro};
  });
}
function getTotals(daily){
  const d=D();
  const t=daily.reduce((a,dt)=>({spend:a.spend+dt.spend,fat:a.fat+dt.faturamento,vendas:a.vendas+dt.vendas,
    taxa:a.taxa+(d.vendas[dt.date]?.taxa||0)}),{spend:0,fat:0,vendas:0,taxa:0});
  return{...t,faturamento:t.fat,
    roas:t.spend>0?t.fat/t.spend:0,cpv:t.vendas>0?t.spend/t.vendas:0,
    ticket:t.vendas>0?t.fat/t.vendas:0,lucro:t.fat-t.taxa-(t.spend*TAXA_IMPOSTO)};
}


// ── Derived — Tráfego ──────────────────────────────────────────────────────
function getDailyT(start,end,temp=null){
  const d=D();
  const isTemp=temp&&temp!=="consolidado";
  const tempData=isTemp?getMetaVendasByTemp(temp):null;
  const metaSrc=isTemp?tempData.metaByDate:d.meta;
  const vendasSrc=isTemp?tempData.vendasByDate:d.vendas;
  return Object.keys(metaSrc).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaSrc[date]||{spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0};
    const v=vendasSrc[date]||{qtd:0};
    const cpc   = m.clicks>0     ? m.spend/m.clicks          : 0;
    const ctr   = m.impressions>0 ? (m.clicks/m.impressions)*100 : 0;
    const cpm   = m.impressions>0 ? (m.spend/m.impressions)*1000 : 0;
    const txPagChk = m.landingViews>0 ? (m.checkouts/m.landingViews)*100 : 0;
    const txChkVnd = m.checkouts>0    ? (v.qtd/m.checkouts)*100           : 0;
    const connect  = m.clicks>0       ? (m.landingViews/m.clicks)*100     : 0;
    return{date,label:fDate(date),spend:m.spend,cpv:v.qtd>0?m.spend/v.qtd:0,
      cpc,ctr,cpm,txPagChk,txChkVnd,connect,
      clicks:m.clicks,impressions:m.impressions,landingViews:m.landingViews,
      checkouts:m.checkouts,vendas:v.qtd};
  });
}
function getTotalsT(daily){
  const t=daily.reduce((a,d)=>({spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
    impressions:a.impressions+d.impressions,landingViews:a.landingViews+d.landingViews,
    checkouts:a.checkouts+d.checkouts,vendas:a.vendas+d.vendas}),
    {spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,vendas:0});
  return{...t,
    cpc:   t.clicks>0       ? t.spend/t.clicks              : 0,
    ctr:   t.impressions>0  ? (t.clicks/t.impressions)*100  : 0,
    cpm:   t.impressions>0  ? (t.spend/t.impressions)*1000  : 0,
    txPagChk: t.landingViews>0 ? (t.checkouts/t.landingViews)*100 : 0,
    txChkVnd: t.checkouts>0    ? (t.vendas/t.checkouts)*100       : 0,
    connect:  t.clicks>0       ? (t.landingViews/t.clicks)*100    : 0,
  };
}

// Totais de um dia específico
function getDayMetrics(iso,temp=null){

  };
}

const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}

function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    // find zero Y
    const yZero=yP(0);
    ctx.lineTo(xP(n-1),yZero);ctx.lineTo(xP(0),yZero);ctx.closePath();
    const cH=ctx.canvas.height/DPR;
    const g=ctx.createLinearGradient(0,0,0,cH);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}

// Gráfico simples (1 eixo, 1 linha) + overlay opcional nos 2 eixos Y
function drawChartWithOverlay(id, data, key, fmtY, refVal, refLabel, overlayInv, overlayCpv, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:overlayInv||overlayCpv?52:12,b:26,l:52};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;

  const vals=data.map(d=>+(d[key])||0);
  const invVals=data.map(d=>d.spend||0);
  const cpvVals=data.map(d=>d.cpv||0);

  // Domínio eixo Y esquerda (métrica principal)
  let allL=[...vals];if(refVal!=null)allL.push(refVal);
  const lMax=Math.max(...allL,0.01)*1.2, lMin=0;
  // Domínio eixo Y direita (overlay)
  const rVals=overlayCpv?cpvVals:invVals;
  const rMax=overlayInv||overlayCpv?Math.max(...rVals,0.01)*1.2:1;

  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-lMin)/(lMax-lMin))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;

  // Grid + eixo Y esquerda
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    const lv=lMax-(i/4)*(lMax-lMin);
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lv),P.l-4,y+3);
  }

  // Eixo Y direita se overlay ativo
  if(overlayInv||overlayCpv){
    const ovColor=overlayInv?CHART_INV:CHART_CPV;
    const ovFmt=overlayInv?fBRLShort:v=>"R$"+v.toFixed(2).replace(".",",");
    for(let i=0;i<=4;i++){
      const rv=rMax-(i/4)*(rMax-0);
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=ovColor;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="left";
      ctx.fillText(ovFmt(rv),P.l+cW+4,y+3);
    }
  }

  // Linha de referência
  if(refVal!=null){
    const ry=yPL(refVal);
    ctx.strokeStyle=CHART_COLOR+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,ry);ctx.lineTo(P.l+cW,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_COLOR;ctx.font="8px 'Inter',sans-serif";ctx.textAlign="right";
    ctx.fillText(refLabel||"Meta",P.l+cW,ry-3);
  }

  // Linha principal
  drawLineArea(ctx,xP,yPL,vals,CHART_COLOR,true);

  // Overlay
  if(overlayInv) drawLineArea(ctx,xP,yPR,invVals,CHART_INV,false);
  if(overlayCpv) drawLineArea(ctx,xP,yPR,cpvVals,CHART_CPV,false);

  // X labels
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Gráfico dual-axis (investimento x CPV) — linha tracejada opcional de investimento planejado
function drawDual(id,data,cssW,cssH,showPlan=false){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:52,b:28,l:58};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpv||0);
  const planVals=showPlan?data.map(d=>d.spendPlanejado):[];
  const planNums=planVals.filter(v=>v!=null);
  const lMax=Math.max(...lVals,...planNums,0.01)*1.15;
  const rMax=Math.max(...rVals,META_CPV,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-0)/(lMax-0))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  const mY=yPR(META_CPV);
  ctx.strokeStyle=CHART_CPV+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=CHART_CPV;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
  ctx.fillText("Meta R$"+META_CPV,P.l+cW+4,mY-3);
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPV,false);
  // Linha tracejada — investimento planejado (mesma escala do investimento real, eixo esquerdo)
  if(planNums.length){
    const pts=[];
    data.forEach((d,i)=>{ if(d.spendPlanejado!=null) pts.push([xP(i),yPL(d.spendPlanejado)]); });
    ctx.beginPath();
    ctx.strokeStyle="#fbbf24";ctx.lineWidth=2;ctx.setLineDash([5,4]);
    pts.forEach(([x,y],i)=>{ i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#fbbf24";
    pts.forEach(([x,y])=>{ ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill(); });
  }
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Tooltip genérico
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

// Gráfico de barras — vendas por dia (planKey opcional: sobrepõe linha tracejada de planejamento)
function drawBarVendas(id, data, cssW, cssH, key="vendas", color="#34d399", planKey=null, planColor="#fbbf24"){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:22,r:16,b:26,l:32};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d[key]||0);
  const planVals=planKey?data.map(d=>d[planKey]):null;
  const planNums=planVals?planVals.filter(v=>v!=null):[];
  const maxV=Math.max(...vals,...planNums,1);

  // Grid horizontal
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y=P.t+(i/ticks)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    if(i<ticks){
      const lv=Math.round(maxV-(i/ticks)*maxV);
      ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
      ctx.fillText(lv,P.l-4,y+3);
    }
  }

  // Barras
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  for(let i=0;i<n;i++){
    const v=vals[i];
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const cx=P.l+slot*i+slot/2;
    const x=cx-barW/2;
    const y=P.t+cH-bh;
    // Gradiente
    const g=ctx.createLinearGradient(0,y,0,P.t+cH);
    g.addColorStop(0,color+"dd");g.addColorStop(1,color+"55");
    ctx.fillStyle=g;
    // Barra com cantos arredondados no topo
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);
    ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx.lineTo(x+barW,y+bh);ctx.lineTo(x,y+bh);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    ctx.fill();
    // Número acima da barra
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";
      ctx.fillText(v,cx,y-4);
    }
  }

  // Linha tracejada — planejado (sobreposta às barras, para comparar planejado × realizado)
  if(planKey){
    const pts=[];
    for(let i=0;i<n;i++){
      const v=planVals[i];
      if(v==null) continue;
      const cx=P.l+slot*i+slot/2;
      const y=P.t+cH-(v/maxV)*cH;
      pts.push([cx,y,v]);
    }
    if(pts.length){
      ctx.beginPath();
      ctx.strokeStyle=planColor;ctx.lineWidth=2;ctx.setLineDash([5,4]);
      pts.forEach(([x,y],i)=>{ i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=planColor;
      pts.forEach(([x,y])=>{ ctx.beginPath();ctx.arc(x,y,2.5,0,Math.PI*2);ctx.fill(); });
    }
  }

  // Labels X
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// ── Render Tráfego ─────────────────────────────────────────────────────────
function renderTrafego(){
  const el=document.getElementById("page-trafego");if(!el)return;
  const isTemp=S.currentTemp!=="consolidado";
  const today=todayISO();
  const todayM=getDayMetrics(today,S.currentTemp);

  // Últimos 3 dias consolidados (D-3 a D-1)
  const p3Start=subDays(today,3);
  const p3End=subDays(today,1);
  const p3Daily=getDailyT(p3Start,p3End,S.currentTemp);
  const p3Tot=getTotalsT(p3Daily);

  const daily=getDailyT(S.startDate,S.endDate,S.currentTemp);

  // Definição das métricas: key, label, fmtFn, metaVal, higher, rawKey (para statusColor)
  const METRICS=[
    {key:"spend",    lbl:"Investimento",          fmt:fBRL,  meta:null,                   higher:null},
    {key:"cpv",      lbl:"Custo por Venda",        fmt:fBRL,  meta:META_CPV,               higher:false},
    {key:"cpc",      lbl:"CPC",                    fmt:fBRL,  meta:METAS_T.cpc.val,        higher:false},
    {key:"ctr",      lbl:"CTR",                    fmt:fPct,  meta:METAS_T.ctr.val,        higher:true},
    {key:"cpm",      lbl:"CPM",                    fmt:fBRL,  meta:METAS_T.cpm.val,        higher:false},
    {key:"txPagChk", lbl:"Tx Pág → Checkout",      fmt:fPct,  meta:METAS_T.txPagChk.val,  higher:true},
    {key:"txChkVnd", lbl:"Tx Checkout → Venda",    fmt:fPct,  meta:METAS_T.txChkVnd.val,  higher:true},
    {key:"connect",  lbl:"Connect Rate",           fmt:fPct,  meta:METAS_T.connect.val,    higher:true},
  ];

  // Formato da meta para o subtítulo — sempre no formato correto da métrica
  function metaSub(m){
    if(!m.meta) return "";
    return `Meta: ${m.fmt(m.meta)}`;
  }

  // Cards de uma linha de métricas a partir de um objeto com os valores
  function metricsRow(dataObj){
    return METRICS.map(m=>{
      const rawVal=dataObj[m.key]||0;
      const color=m.meta?statusColor(rawVal,m.meta,m.higher):"var(--text-strong)";
      const bord=m.meta?statusBorder(rawVal,m.meta,m.higher):"var(--border)";
      return `<div class="kc" style="padding:12px 14px;border-color:${bord}">
        <div class="kc-lbl">${m.lbl}</div>
        <div class="kc-val" style="color:${color};font-size:17px">${m.fmt(rawVal)}</div>
        ${m.meta?`<div class="kc-sub">${metaSub(m)}</div>`:""}
      </div>`;
    }).join("");
  }

  function overlayBtn(key,which,label){
    const on=S.overlays[key][which];
    const color=which==="inv"?CHART_INV:CHART_CPV;
    return `<button class="btn-overlay${on?" on":""}"
      style="${on?`border-color:${color};color:${color};background:${color}18`:""}"
      onclick="toggleOverlay('${key}','${which}')">${label}</button>`;
  }

  // Gráficos em grade 2×3
  const CHART_CONFIGS=[
    {key:"ctr",      lbl:"CTR",                    fmt:fPct, meta:METAS_T.ctr.val,        metaLbl:"Meta 2,5%"},
    {key:"cpm",      lbl:"CPM",                    fmt:fBRL, meta:METAS_T.cpm.val,        metaLbl:"Meta $5,96"},
    {key:"cpc",      lbl:"CPC",                    fmt:fBRL, meta:METAS_T.cpc.val,        metaLbl:"Meta $0,24"},
    {key:"txPagChk", lbl:"Tx Pág → Checkout",      fmt:fPct, meta:METAS_T.txPagChk.val,  metaLbl:"Meta 5,3%"},
    {key:"txChkVnd", lbl:"Tx Checkout → Venda",    fmt:fPct, meta:METAS_T.txChkVnd.val,  metaLbl:"Meta 18,3%"},
    {key:"connect",  lbl:"Connect Rate",           fmt:fPct, meta:METAS_T.connect.val,    metaLbl:"Meta 70%"},
  ];

  function tChart(c){
    return `<div class="cc" style="position:relative">
      <div class="ch">
        <span class="ct">${c.lbl}</span>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:10px;color:var(--hint)">${c.metaLbl}</span>
          <div class="overlay-btns">
            ${overlayBtn(c.key,"inv","+ Invest.")}

  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Métricas de Tráfego</div>

          </thead>
          <tbody>
            ${(()=>{
              const mp=isTemp?((S.metaByPlatformByTemp||{})[S.currentTemp]||{}):(S.metaByPlatform||{});
              const vp=isTemp?((S.vendasByPlatformByTemp||{})[S.currentTemp]||{}):(S.vendasByPlatform||{});
              const allPlatforms=[...new Set([...Object.keys(mp),...Object.keys(vp)])];
              const order=["instagram","facebook","audience_network","messenger","threads"];
              const sorted=[...order.filter(p=>allPlatforms.includes(p)),...allPlatforms.filter(p=>!order.includes(p))];
              const labels={instagram:"Instagram",facebook:"Facebook",audience_network:"Audience Network",messenger:"Messenger",threads:"Threads"};
              return sorted.map((p,i)=>{

                const v=vp[p]||{qtd:0,valor:0};
                const cpv=v.qtd>0?m.spend/v.qtd:0;

        <table style="width:100%;border-collapse:collapse;font-size:12px">

              ${["Formato","Plataforma","Vendas","CPV","Faturamento","ROAS"].map(h=>`<th style="padding:7px 12px;text-align:${h==="Formato"||h==="Plataforma"?"left":"right"};background:var(--surf);border-bottom:1px solid var(--border);color:var(--hint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px">${h}</th>`).join("")}
            </tr>

          <tbody>
            ${(()=>{
              const vpl=isTemp?((S.vendasByPlacementByTemp||{})[S.currentTemp]||{}):(S.vendasByPlacement||{});
              const mp=isTemp?((S.metaByPlatformByTemp||{})[S.currentTemp]||{}):(S.metaByPlatform||{});
              const vp=isTemp?((S.vendasByPlatformByTemp||{})[S.currentTemp]||{}):(S.vendasByPlatform||{});
              const sorted=Object.entries(vpl).sort((a,b)=>b[1].qtd-a[1].qtd);
              const fmtLabel=pl=>{
